  function generateWorkoutPlan(answers, excludedNames){
    excludedNames = excludedNames || [];
    const focusAreas = answers.focusAreas || [];
    const groups = groupLibraryByMuscle();
    const exPerGroup = answers.level==='iniciante' ? 2 : (answers.level==='avancado' ? 4 : 3);
    const reducedGroups = new Set();
    (answers.limitations || []).forEach(lim=>{ (LIMITATION_REDUCED_GROUPS[lim] || []).forEach(g=> reducedGroups.add(g)); });
    function pick(groupName, n){
      let target = focusAreas.includes(groupName) ? n + 2 : n;
      // Camada extra de segurança: além de excluir os exercícios mais arriscados,
      // reduz também a quantidade nos grupos afetados pela limitação da pessoa —
      // menos volume ali, mesmo entre os exercícios considerados seguros.
      if(reducedGroups.has(groupName)) target = Math.max(1, Math.ceil(target/2));
      const list = (groups[groupName] || []).filter(e=> !excludedNames.includes(e.name));
      return list.slice(0, Math.min(target, list.length));
    }
    let plan = [];
    if(answers.days <= 2){
      const fullBodyGroups = ['Treino de Peito','Treino de Costas','Treino de Pernas','Treino de Ombros','Treino de Bíceps','Treino de Tríceps','Treino de Abdômen'];
      const exs = [];
      fullBodyGroups.forEach(g=> exs.push(...pick(g, Math.max(1, Math.round(exPerGroup/2)))));
      plan.push({ name: 'Treino Full Body (gerado pela avaliação)', exercises: exs });
    } else if(answers.days === 3){
      plan.push({ name: 'Treino A — Superiores 1 (gerado pela avaliação)', exercises: [
        ...pick('Treino de Peito', exPerGroup), ...pick('Treino de Ombros', Math.max(1,exPerGroup-1)), ...pick('Treino de Tríceps', Math.max(1,exPerGroup-1))
      ]});
      plan.push({ name: 'Treino B — Inferiores (gerado pela avaliação)', exercises: [
        ...pick('Treino de Pernas', exPerGroup+1), ...pick('Treino de Glúteos', exPerGroup), ...pick('Treino de Panturrilhas', 2), ...pick('Treino de Abdômen', exPerGroup)
      ]});
      plan.push({ name: 'Treino C — Superiores 2 (gerado pela avaliação)', exercises: [
        ...pick('Treino de Costas', exPerGroup), ...pick('Treino de Bíceps', Math.max(1,exPerGroup-1)), ...pick('Treino de Trapézio', 2)
      ]});
    } else if(answers.days === 4){
      plan.push({ name: 'Treino A — Superiores 1 (gerado pela avaliação)', exercises: [...pick('Treino de Peito', exPerGroup), ...pick('Treino de Ombros', exPerGroup), ...pick('Treino de Tríceps', exPerGroup)] });
      plan.push({ name: 'Treino B — Inferiores 1 (gerado pela avaliação)', exercises: [...pick('Treino de Pernas', exPerGroup+1), ...pick('Treino de Abdômen', exPerGroup)] });
      plan.push({ name: 'Treino C — Superiores 2 (gerado pela avaliação)', exercises: [...pick('Treino de Costas', exPerGroup), ...pick('Treino de Trapézio', 2), ...pick('Treino de Bíceps', exPerGroup), ...pick('Treino de Antebraço', 2)] });
      plan.push({ name: 'Treino D — Inferiores 2 (gerado pela avaliação)', exercises: [...pick('Treino de Glúteos', exPerGroup), ...pick('Treino de Panturrilhas', 2)] });
    } else {
      plan.push({ name: 'Treino de Peito (gerado pela avaliação)', exercises: pick('Treino de Peito', exPerGroup+2) });
      plan.push({ name: 'Treino de Costas (gerado pela avaliação)', exercises: pick('Treino de Costas', exPerGroup+2) });
      plan.push({ name: 'Treino de Pernas (gerado pela avaliação)', exercises: pick('Treino de Pernas', exPerGroup+2) });
      plan.push({ name: 'Treino de Ombros (gerado pela avaliação)', exercises: pick('Treino de Ombros', exPerGroup+1) });
      plan.push({ name: 'Treino de Braços (gerado pela avaliação)', exercises: [...pick('Treino de Bíceps', exPerGroup), ...pick('Treino de Tríceps', exPerGroup)] });
    }
    if(answers.includeCardioFinisher && groups['Treino de Cardio']){
      plan.forEach(day=>{
        const isLower = /inferior/i.test(day.name);
        const finisherName = isLower ? answers.cardioFinisherLower : answers.cardioFinisherUpper;
        if(!finisherName) return;
        const finisherEx = groups['Treino de Cardio'].find(e=> e.name === finisherName);
        if(finisherEx && !excludedNames.includes(finisherEx.name)){
          day.exercises = [...day.exercises, { ...finisherEx, sets:1, reps:'10-15 minutos', rest_seconds:0 }];
        }
      });
    }
    if(answers.includeCardio && groups['Treino de Cardio'] && groups['Treino de Cardio'].length){
      const cardioExercises = groups['Treino de Cardio'].filter(e=> !excludedNames.includes(e.name));
      plan.push({ name: 'Cardio (gerado pela avaliação)', exercises: cardioExercises });
    }
    return plan.filter(day=> day.exercises.length>0);
  }

  async function openWorkoutDetail(id){
    const w = workouts.find(x=>x.id===id);
    if(!w) return;
    const canEdit = w.created_by === currentUser.id || w.assigned_to_user_id === currentUser.id;
    const isLibraryWorkout = w.assigned_to_user_id === null;
    const canDelete = !isLibraryWorkout && (w.created_by === currentUser.id || w.assigned_to_user_id === currentUser.id);

    const { data: openSession } = await sb.from('workout_sessions').select('*').eq('user_id', currentUser.id).eq('workout_id', id).is('finished_at', null).order('started_at', {ascending:false}).limit(1).maybeSingle();
    const STALE_SESSION_HOURS = 6;
    if(openSession && (Date.now() - new Date(openSession.started_at).getTime()) > STALE_SESSION_HOURS*3600*1000){
      // Sessão antiga demais pra ainda ser considerada "em andamento" — provavelmente
      // a pessoa fechou o app sem finalizar. Encerra sem contar uma duração inventada,
      // em vez de deixar a contagem seguir rodando desde então.
      await sb.from('workout_sessions').update({ finished_at: new Date().toISOString(), duration_seconds: null }).eq('id', openSession.id);
    } else if(openSession){
      activeSessionId = openSession.id;
      activeSessionWorkoutId = id;
      sessionStartTime = new Date(openSession.started_at).getTime();
    } else if(activeSessionWorkoutId !== id){
      activeSessionId = null; activeSessionWorkoutId = null; sessionStartTime = null;
    }

    const overlay = buildOverlay(`
      <h3 class="fr-form-title">${esc(w.name)}</h3>
      ${w.notes ? `<p class="fr-hint" style="margin-bottom:14px;">${esc(w.notes)}</p>` : ''}
      <div id="fr-session-box"></div>
      <div id="fr-workout-exercises"><div class="fr-loading">Carregando exercícios...</div></div>
      <button type="button" class="fr-btn-ghost" id="fr-session-history-toggle" style="width:100%;margin-top:14px;">📅 Ver histórico de sessões deste treino</button>
      <div id="fr-session-history-box"></div>
      ${canEdit ? `<button class="fr-btn-ghost" id="fr-workout-edit" style="width:100%;margin-top:10px;">Gerenciar exercícios / editar treino</button>` : ''}
      ${canDelete ? `
      <div id="fr-detail-delete-area" style="margin-top:18px;padding-top:16px;border-top:1px solid var(--border);">
        <button class="fr-btn-danger" id="fr-detail-delete-workout" style="width:100%;">Excluir este treino</button>
      </div>` : ''}
    `);
    overlay.querySelector('#fr-session-history-toggle').addEventListener('click', ()=> toggleSessionHistory(id));
    if(canEdit){
      overlay.querySelector('#fr-workout-edit').addEventListener('click', ()=>{ stopSessionTimerDisplay(); closeOverlay(); openWorkoutExerciseManager(w.id, w.name); });
    }
    if(canDelete){
      overlay.querySelector('#fr-detail-delete-workout').addEventListener('click', function(){
        const area = overlay.querySelector('#fr-detail-delete-area');
        area.innerHTML = `
          <div class="fr-confirm-row">
            <span class="fr-confirm-text">Excluir "${esc(w.name)}"? Não pode ser desfeito.</span>
            <button class="fr-btn-ghost" id="fr-detail-cancel-delete">Cancelar</button>
            <button class="fr-btn-danger" id="fr-detail-confirm-delete">Confirmar exclusão</button>
          </div>`;
        area.querySelector('#fr-detail-cancel-delete').addEventListener('click', ()=>{ stopSessionTimerDisplay(); closeOverlay(); openWorkoutDetail(id); });
        area.querySelector('#fr-detail-confirm-delete').addEventListener('click', async function(){
          const btn = this; btn.disabled = true; btn.textContent = 'Excluindo...';
          const { error } = await sb.from('workouts').delete().eq('id', id);
          if(error){ showToast('Não foi possível excluir. Tente novamente.', 'err'); btn.disabled=false; btn.textContent='Confirmar exclusão'; return; }
          showToast('Treino excluído.', 'ok');
          stopSessionTimerDisplay();
          closeOverlay();
          loadWorkouts();
        });
      });
    }

    renderSessionBox(overlay, id, w.name);

    if(activeSessionId){
      const { data: comps } = await sb.from('session_exercise_completions').select('exercise_id').eq('session_id', activeSessionId);
      sessionCompletedExerciseIds = new Set((comps||[]).map(c=>c.exercise_id));
    } else {
      sessionCompletedExerciseIds = new Set();
    }

    const { data, error } = await sb.from('workout_exercises').select('*').eq('workout_id', id).order('position');
    const exEl = overlay.querySelector('#fr-workout-exercises');
    if(error){ exEl.innerHTML = `<p class="fr-hint">Não foi possível carregar.</p>`; return; }
    const exercises = data || [];
    if(exercises.length===0){ exEl.innerHTML = `<p class="fr-hint">Nenhum exercício cadastrado ainda.</p>`; return; }
    exEl.innerHTML = exercises.map((ex,i)=>exerciseCardHtml(ex, i+1, !!activeSessionId, sessionCompletedExerciseIds.has(ex.id))).join('');
    exercises.forEach(ex=>{
      const videoBtn = exEl.querySelector(`#fr-ex-video-${ex.id}`);
      if(videoBtn) videoBtn.addEventListener('click', ()=> window.open(ex.video_url, '_blank', 'noopener'));
      const timerBtn = exEl.querySelector(`#fr-ex-timer-${ex.id}`);
      if(timerBtn) timerBtn.addEventListener('click', ()=> startRestTimer(ex.id, ex.rest_seconds || 60));
      const uploadBtn = exEl.querySelector(`#fr-ex-upload-${ex.id}`);
      if(uploadBtn) uploadBtn.addEventListener('click', ()=> openSubmissionForm(ex.id));
      const doneBox = exEl.querySelector(`#fr-ex-done-${ex.id}`);
      if(doneBox) doneBox.addEventListener('change', ()=> toggleExerciseCompletion(ex.id, doneBox.checked));
      const loadToggle = exEl.querySelector(`#fr-ex-load-toggle-${ex.id}`);
      if(loadToggle) loadToggle.addEventListener('click', ()=>{
        const box = document.getElementById(`fr-ex-load-box-${ex.id}`);
        const opening = box.style.display==='none';
        box.style.display = opening ? '' : 'none';
        if(opening) fillLastLoadHints(ex);
      });
      const loadSave = exEl.querySelector(`#fr-ex-load-save-${ex.id}`);
      if(loadSave) loadSave.addEventListener('click', ()=> saveExerciseLoad(ex));
      const loadHistory = exEl.querySelector(`#fr-ex-load-history-${ex.id}`);
      if(loadHistory) loadHistory.addEventListener('click', ()=> toggleLoadHistory(ex));
      // Exercícios com detalhe por série (vindos de importação) já mostram
      // a caixa de registrar carga aberta direto, sem precisar clicar em
      // "Registrar carga" (esse botão nem existe nesse caso) — então busca
      // o "quanto fiz da última vez" assim que o cartão é montado.
      if(Array.isArray(ex.sets_detail) && ex.sets_detail.length > 0){
        fillLastLoadHints(ex);
        const loadBox = document.getElementById(`fr-ex-load-box-${ex.id}`);
        if(loadBox){
          loadBox.querySelectorAll('.fr-set-timer-btn').forEach(btn=>{
            btn.addEventListener('click', ()=> startRestTimer(ex.id, parseInt(btn.getAttribute('data-rest'), 10) || 60));
          });
        }
      }
    });
  }

  async function toggleSessionHistory(workoutId){
    const box = document.getElementById('fr-session-history-box');
    if(!box) return;
    if(box.innerHTML){ box.innerHTML = ''; return; }
    box.innerHTML = `<div class="fr-loading" style="margin:10px 0;">Carregando histórico...</div>`;
    const { data, error } = await sb.from('workout_sessions').select('*').eq('user_id', currentUser.id).eq('workout_id', workoutId).not('finished_at', 'is', null).order('started_at', {ascending:false}).limit(15);
    if(error){ box.innerHTML = `<p class="fr-hint">Não foi possível carregar.</p>`; return; }
    const sessions = data || [];
    if(sessions.length===0){ box.innerHTML = `<p class="fr-hint">Nenhuma sessão concluída ainda pra esse treino.</p>`; return; }
    box.innerHTML = `
      <div class="fr-evo-title" style="margin-top:10px;">Sessões concluídas (mais recentes primeiro)</div>
      ${sessions.map(s=>{
        const dateLabel = formatDateLabel(s.started_at.slice(0,10));
        const timeLabel = new Date(s.started_at).toLocaleTimeString('pt-BR', {hour:'2-digit', minute:'2-digit'});
        const duration = s.duration_seconds ? formatTimer(s.duration_seconds) : '—';
        return `<div class="fr-session-hist-row"><span>${esc(dateLabel)} · ${esc(timeLabel)}</span><b>${esc(duration)}</b></div>`;
      }).join('')}
    `;
  }

  function renderSessionBox(overlay, workoutId, workoutName){
    const box = overlay.querySelector('#fr-session-box');
    if(!box) return;
    if(!activeSessionId){
      box.innerHTML = `<button class="fr-btn-primary" id="fr-start-session" style="width:100%;margin-bottom:14px;">▶ Iniciar treino</button>`;
      box.querySelector('#fr-start-session').addEventListener('click', async function(){
        this.disabled = true; this.textContent = 'Iniciando...';
        const { data, error } = await sb.from('workout_sessions').insert({ user_id: currentUser.id, workout_id: workoutId, workout_name: workoutName }).select().single();
        if(error){ showToast('Não foi possível iniciar. Tente novamente.', 'err'); this.disabled=false; this.textContent='▶ Iniciar treino'; return; }
        activeSessionId = data.id; activeSessionWorkoutId = workoutId; sessionStartTime = new Date(data.started_at).getTime();
        showToast('Treino iniciado. Bom treino!', 'ok');
        closeOverlay();
        openWorkoutDetail(workoutId);
      });
      return;
    }
    box.innerHTML = `
      <div class="fr-session-active">
        <span class="fr-session-timer" id="fr-session-timer">00:00</span>
        <button class="fr-btn-primary" id="fr-finish-session">■ Finalizar treino</button>
      </div>`;
    updateSessionTimerDisplay();
    stopSessionTimerDisplay();
    sessionTimerInterval = setInterval(updateSessionTimerDisplay, 1000);
    box.querySelector('#fr-finish-session').addEventListener('click', async function(){
      this.disabled = true; this.textContent = 'Finalizando...';
      let durationSeconds = Math.floor((Date.now() - sessionStartTime)/1000);
      const MAX_REASONABLE_SECONDS = 6*3600;
      if(durationSeconds > MAX_REASONABLE_SECONDS){
        // Duração implausível pra um treino — provavelmente o app ficou fechado
        // no meio. Guarda sem duração, em vez de um número claramente errado.
        durationSeconds = null;
      }
      const { error } = await sb.from('workout_sessions').update({ finished_at: new Date().toISOString(), duration_seconds: durationSeconds }).eq('id', activeSessionId);
      if(error){ showToast('Não foi possível finalizar. Tente novamente.', 'err'); this.disabled=false; this.textContent='■ Finalizar treino'; return; }
      await sb.from('workout_completions').insert({ user_id: currentUser.id, workout_id: workoutId, date: todayStr() });
      stopSessionTimerDisplay();
      activeSessionId = null; activeSessionWorkoutId = null; sessionStartTime = null;
      showToast(durationSeconds ? `Treino finalizado! Duração: ${formatTimer(durationSeconds)}.` : 'Treino finalizado!', 'ok');
      closeOverlay();
    });
  }

  function updateSessionTimerDisplay(){
    const el = document.getElementById('fr-session-timer');
    if(!el || !sessionStartTime){ stopSessionTimerDisplay(); return; }
    const elapsed = Math.floor((Date.now() - sessionStartTime)/1000);
    el.textContent = formatTimer(elapsed);
  }
  function stopSessionTimerDisplay(){
    if(sessionTimerInterval){ clearInterval(sessionTimerInterval); sessionTimerInterval = null; }
  }

  async function toggleExerciseCompletion(exerciseId, checked){
    if(!activeSessionId) return;
    if(checked){
      const { error } = await sb.from('session_exercise_completions').insert({ session_id: activeSessionId, user_id: currentUser.id, exercise_id: exerciseId });
      if(error){ showToast('Não foi possível marcar.', 'err'); return; }
      sessionCompletedExerciseIds.add(exerciseId);
    } else {
      const { error } = await sb.from('session_exercise_completions').delete().eq('session_id', activeSessionId).eq('exercise_id', exerciseId);
      if(error){ showToast('Não foi possível desmarcar.', 'err'); return; }
      sessionCompletedExerciseIds.delete(exerciseId);
    }
    // Atualiza a aparência na hora, sem precisar sair e voltar da tela.
    const checkbox = document.getElementById(`fr-ex-done-${exerciseId}`);
    const card = checkbox ? checkbox.closest('.fr-exercise') : null;
    if(card){
      card.classList.toggle('fr-exercise-done', checked);
      const numEl = card.querySelector('.fr-exercise-num');
      if(numEl) numEl.textContent = checked ? '✓' : numEl.getAttribute('data-num');

  // Mostra, como placeholder em cada série, o peso e as repetições
  // feitos da última vez nesse exercício (numa sessão anterior, não na
  // sessão atual) — assim a pessoa vê de cara "quanto fiz da última
  // vez" ao abrir a caixa de registrar carga, sem precisar clicar em
  // "Ver histórico" separadamente. Só busca uma vez por abertura da
  // tela (dataset.hintsLoaded evita repetir a consulta toda hora que
  // a caixa é aberta/fechada).
  async function fillLastLoadHints(ex){
    const box = document.getElementById(`fr-ex-load-box-${ex.id}`);
    if(!box || box.dataset.hintsLoaded) return;
    box.dataset.hintsLoaded = '1';
    let q = sb.from('exercise_load_logs').select('set_number, weight_kg, reps_done, session_id, created_at')
      .eq('user_id', currentUser.id).eq('exercise_id', ex.id)
      .order('created_at', { ascending: false }).limit(60);
    if(activeSessionId) q = q.neq('session_id', activeSessionId);
    const { data, error } = await q;
    if(error || !data || data.length===0) return;
    // A primeira linha (mais recente) já diz qual foi a última sessão;
    // pega só as séries dessa sessão específica.
    const lastSessionId = data[0].session_id;
    const bySet = {};
    data.filter(l=> l.session_id===lastSessionId).forEach(l=>{
      if(!(l.set_number in bySet)) bySet[l.set_number] = l;
    });
    Object.keys(bySet).forEach(setNum=>{
      const row = box.querySelector(`.fr-load-set-row[data-set="${setNum}"]`);
      if(!row) return;
      const l = bySet[setNum];
      const w = row.querySelector('.fr-load-weight');
      const r = row.querySelector('.fr-load-reps');
      if(w && l.weight_kg!=null) w.placeholder = `última: ${l.weight_kg}kg`;
      if(r && l.reps_done!=null) r.placeholder = `última: ${l.reps_done}`;
    });
  }

  async function saveExerciseLoad(ex){
    const box = document.getElementById(`fr-ex-load-box-${ex.id}`);
    const rows = Array.from(box.querySelectorAll('.fr-load-set-row'));
    const toSave = [];
    rows.forEach(row=>{
      const setNum = parseInt(row.getAttribute('data-set'), 10);
      const weight = row.querySelector('.fr-load-weight').value;
      const reps = row.querySelector('.fr-load-reps').value;
      if(weight!=='' || reps!==''){
        toSave.push({ user_id: currentUser.id, session_id: activeSessionId, exercise_id: ex.id, exercise_name: ex.name, set_number: setNum, weight_kg: weight===''?null:parseFloat(weight), reps_done: reps===''?null:parseInt(reps,10) });
      }
    });
    if(toSave.length===0){ showToast('Preencha ao menos uma série.', 'err'); return; }
    const btn = document.getElementById(`fr-ex-load-save-${ex.id}`);
    btn.disabled = true; btn.textContent = 'Salvando...';
    const { error } = await sb.from('exercise_load_logs').insert(toSave);
    btn.disabled = false; btn.textContent = 'Salvar cargas';
    if(error){ showToast('Não foi possível salvar. Tente novamente.', 'err'); return; }
    showToast('Carga registrada!', 'ok');
    // Recolhe a caixa de registrar carga depois de salvar, pra liberar espaço na tela.
    box.style.display = 'none';
    const historyBox = document.getElementById(`fr-ex-load-history-box-${ex.id}`);
    if(historyBox) historyBox.innerHTML = '';
    rows.forEach(row=>{
      row.querySelector('.fr-load-weight').value = '';
      row.querySelector('.fr-load-reps').value = '';
    });
  }

  async function toggleLoadHistory(ex){
    const histBox = document.getElementById(`fr-ex-load-history-box-${ex.id}`);
    if(histBox.innerHTML){ histBox.innerHTML = ''; return; }
    histBox.innerHTML = `<div class="fr-loading" style="margin:10px 0;">Carregando evolução...</div>`;
    const { data, error } = await sb.from('exercise_load_logs').select('*').eq('user_id', currentUser.id).eq('exercise_id', ex.id).order('created_at', {ascending:true}).limit(200);
    if(error || !data || data.length===0){ histBox.innerHTML = `<p class="fr-hint">Nenhum registro anterior ainda.</p>`; return; }

    const byDate = {};
    data.forEach(l=>{
      const d = l.created_at.slice(0,10);
      if(!byDate[d]) byDate[d]=[];
      byDate[d].push(l);
    });
    const dates = Object.keys(byDate).sort(); // cronológico
    const maxByDate = dates.map(d=>{
      const weights = byDate[d].map(l=> Number(l.weight_kg)||0);
      return { date: d, max: weights.length ? Math.max(...weights) : 0 };
    });
    const overallMax = Math.max(...maxByDate.map(m=>m.max), 0.01);
    const last10 = maxByDate.slice(-10);

    const barsHtml = last10.map((m, i)=>{
      const prev = i>0 ? last10[i-1].max : null;
      let trend = '';
      if(prev !== null){
        if(m.max > prev) trend = `<span class="fr-evo-trend fr-evo-up">▲ ${(m.max-prev).toFixed(1)}kg</span>`;
        else if(m.max < prev) trend = `<span class="fr-evo-trend fr-evo-down">▼ ${(prev-m.max).toFixed(1)}kg</span>`;
        else trend = `<span class="fr-evo-trend fr-evo-same">— igual</span>`;
      }
      const pct = Math.max(6, Math.round((m.max/overallMax)*100));
      return `
        <div class="fr-evo-row">
          <span class="fr-evo-date">${esc(formatDateLabel(m.date))}</span>
          <div class="fr-evo-bar-track"><div class="fr-evo-bar-fill" style="width:${pct}%"></div></div>
          <span class="fr-evo-weight">${m.max}kg</span>
          ${trend}
        </div>`;
    }).join('');

    const detailHtml = dates.slice().reverse().slice(0,5).map(d=>`
      <div class="fr-load-history-day">
        <b>${esc(formatDateLabel(d))}</b>
        ${byDate[d].sort((a,b)=>a.set_number-b.set_number).map(l=>`<span>Série ${l.set_number}: ${l.weight_kg??'?'}kg × ${l.reps_done??'?'}</span>`).join('')}
      </div>`).join('');

    histBox.innerHTML = `
      <div class="fr-evo-title">Evolução da carga máxima por sessão</div>
      <div class="fr-evo-chart">${barsHtml}</div>
      <div class="fr-evo-title" style="margin-top:14px;">Detalhe das últimas sessões</div>
      ${detailHtml}
    `;
  }

  // Quando o exercício veio de uma importação com detalhe por série
  // (ex.sets_detail: [{series, carga, tempo, rest_seconds}, ...], vindo
  // do arquivo do personal), cada série tem seu próprio alvo e seu
  // próprio tempo de descanso — diferente de um exercício cadastrado à
  // mão, que só tem um sets/reps/rest_seconds genérico pra tudo. Por
  // isso o cartão de treino tem dois jeitos de mostrar as séries:
  // hasDetail=true mostra uma linha por série (com o texto original do
  // alvo e um botão de descanso com a duração daquela série específica);
  // hasDetail=false mantém o jeito antigo (série 1, 2, 3... genéricas).
  function exerciseCardHtml(ex, num, sessionActive, isCompleted){
    const hasDetail = Array.isArray(ex.sets_detail) && ex.sets_detail.length > 0;
    const metaParts = [];
    if(!hasDetail){
      if(ex.sets) metaParts.push(`${esc(ex.sets)} séries`);
      if(ex.reps) metaParts.push(`${esc(ex.reps)} repetições`);
      if(ex.rest_seconds) metaParts.push(`descanso ${esc(ex.rest_seconds)}s`);
    } else {
      metaParts.push(`${ex.sets_detail.length} séries`);
    }

    let loadRows = '';
    if(hasDetail){
      loadRows = ex.sets_detail.map((sd, idx)=>{
        const s = idx + 1;
        const targetParts = [];
        if(sd.series) targetParts.push(esc(sd.series));
        if(sd.carga) targetParts.push(`carga alvo ${esc(sd.carga)}`);
        if(sd.tempo) targetParts.push(`tempo ${esc(sd.tempo)}`);
        const restSec = sd.rest_seconds || null;
        return `<div class="fr-load-set-row fr-load-set-row-detail" data-set="${s}">
          <div class="fr-load-set-target">
            <span class="fr-load-set-num">Série ${s}</span>
            ${targetParts.length ? `<span class="fr-load-set-target-text">${targetParts.join(' · ')}</span>` : ''}
          </div>
          <input type="number" step="0.5" min="0" class="fr-load-weight" placeholder="kg feito">
          <input type="number" min="0" class="fr-load-reps" placeholder="reps feitas">
          ${restSec ? `<button type="button" class="fr-chip fr-chip-timer fr-set-timer-btn" data-rest="${restSec}">⏱ ${esc(formatTimer(restSec))}</button>` : ''}
        </div>`;
      }).join('');
    } else {
      const setsCount = parseInt(ex.sets) || 3;
      for(let s=1; s<=setsCount; s++){
        loadRows += `<div class="fr-load-set-row" data-set="${s}">
          <span class="fr-load-set-num">Série ${s}</span>
          <input type="number" step="0.5" min="0" class="fr-load-weight" placeholder="kg">
          <input type="number" min="0" class="fr-load-reps" placeholder="reps">
        </div>`;
      }
    }
    return `
      <div class="fr-exercise ${isCompleted ? 'fr-exercise-done' : ''}">
        <div class="fr-exercise-head">
          <div class="fr-exercise-num" data-num="${num}">${isCompleted ? '✓' : num}</div>
          <div class="fr-exercise-name">${esc(ex.name)}</div>
        </div>
        ${metaParts.length ? `<div class="fr-exercise-meta">${metaParts.join(' · ')}</div>` : ''}
        ${ex.notes ? `<div class="fr-hint" style="margin-bottom:10px;">${esc(ex.notes)}</div>` : ''}
        <div class="fr-exercise-actions">
          ${ex.video_url ? `<button type="button" class="fr-chip fr-chip-video" id="fr-ex-video-${ex.id}">▶ Ver vídeo</button>` : ''}
          ${(!hasDetail && ex.rest_seconds) ? `<button type="button" class="fr-chip fr-chip-timer" id="fr-ex-timer-${ex.id}">⏱ Iniciar descanso</button>` : ''}
          <button type="button" class="fr-chip fr-chip-upload" id="fr-ex-upload-${ex.id}">📎 Enviar meu vídeo</button>
          ${!hasDetail ? `<button type="button" class="fr-chip fr-chip-load" id="fr-ex-load-toggle-${ex.id}">🏋 Registrar carga</button>` : ''}
        </div>
        ${sessionActive ? `<label class="fr-ex-check"><input type="checkbox" id="fr-ex-done-${ex.id}" ${isCompleted?'checked':''}> Concluí esse exercício</label>` : ''}
        <div id="fr-ex-timer-box-${ex.id}"></div>
        <div id="fr-ex-load-box-${ex.id}" class="fr-load-box ${hasDetail ? 'fr-load-box-detail' : ''}" style="${hasDetail ? '' : 'display:none'}">
          ${hasDetail ? `<div class="fr-section-label" style="padding-top:0;">Séries deste treino — registre o que você fez</div>` : ''}
          ${loadRows}
          <button type="button" class="fr-btn-primary" id="fr-ex-load-save-${ex.id}" style="width:100%;margin-top:8px;">Salvar cargas</button>
          <button type="button" class="fr-btn-ghost" id="fr-ex-load-history-${ex.id}" style="width:100%;margin-top:6px;">Ver/ocultar histórico</button>
          <div id="fr-ex-load-history-box-${ex.id}"></div>
        </div>
      </div>`;
  }

  function formatTimer(s){
    const m = Math.floor(s/60);
    const sec = s % 60;
    return `${String(m).padStart(2,'0')}:${String(sec).padStart(2,'0')}`;
  }

  function getSoundPref(){
    try{ return localStorage.getItem('saber_timer_sound') || 'classico'; }catch(e){ return 'classico'; }
  }
  function setSoundPref(pref){
    try{ localStorage.setItem('saber_timer_sound', pref); }catch(e){}
  }
  function getSoundEnabled(){
    try{ const v = localStorage.getItem('saber_sound_enabled'); return v === null ? true : v === '1'; }catch(e){ return true; }
  }
  function setSoundEnabled(enabled){
    try{ localStorage.setItem('saber_sound_enabled', enabled ? '1' : '0'); }catch(e){}
  }

  function beepAt(ctx, freq, startTime, duration, waveType){
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.type = waveType || 'sine';
    osc.frequency.value = freq;
    gain.gain.setValueAtTime(0.0001, startTime);
    gain.gain.exponentialRampToValueAtTime(0.35, startTime + 0.02);
    gain.gain.exponentialRampToValueAtTime(0.0001, startTime + duration);
    osc.connect(gain);
    gain.connect(ctx.destination);
    osc.start(startTime);
    osc.stop(startTime + duration + 0.02);
  }

  function playSoundPattern(ctx, pattern){
    const now = ctx.currentTime;
    if(pattern === 'suave'){
      beepAt(ctx, 523, now, 0.3, 'sine');
      beepAt(ctx, 659, now + 0.35, 0.4, 'sine');
    } else if(pattern === 'urgente'){
      beepAt(ctx, 1046, now, 0.1, 'square');
      beepAt(ctx, 1046, now + 0.14, 0.1, 'square');
      beepAt(ctx, 1046, now + 0.28, 0.1, 'square');
      beepAt(ctx, 1046, now + 0.42, 0.18, 'square');
    } else if(pattern === 'sino'){
      beepAt(ctx, 784, now, 0.6, 'triangle');
      beepAt(ctx, 1568, now + 0.05, 0.5, 'triangle');
    } else { // 'classico'
      beepAt(ctx, 880, now, 0.16, 'sine');
      beepAt(ctx, 880, now + 0.22, 0.16, 'sine');
      beepAt(ctx, 1175, now + 0.44, 0.3, 'sine');
    }
  }

  let sharedAudioCtx = null;
  function unlockAudio(){
    try{
      if(!sharedAudioCtx){
        sharedAudioCtx = new (window.AudioContext || window.webkitAudioContext)();
      }
      const ctx = sharedAudioCtx;
      if(ctx.state === 'suspended'){
        ctx.resume();
      }
      // toca um som quase inaudível (não totalmente zero) pra "destravar" o áudio no iOS/Safari
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      gain.gain.value = 0.001;
      osc.frequency.value = 440;
      osc.connect(gain); gain.connect(ctx.destination);
      osc.start(ctx.currentTime);
      osc.stop(ctx.currentTime + 0.05);
    }catch(err){
      console.error('Não foi possível preparar o áudio', err);
    }
  }

  function playTimerEndSound(force){
    if(!force && !getSoundEnabled()) return;
    try{
      const ctx = sharedAudioCtx || new (window.AudioContext || window.webkitAudioContext)();
      if(ctx.state === 'suspended'){ ctx.resume().catch(()=>{}); }
      playSoundPattern(ctx, getSoundPref());
    }catch(err){
      console.error('Não foi possível tocar o som do cronômetro', err);
    }
  }

  const activeRestTimers = {};

  function startRestTimer(exerciseId, seconds){
    const box = document.getElementById('fr-ex-timer-box-'+exerciseId);
    if(!box) return;
    unlockAudio();
    if(activeRestTimers[exerciseId] && activeRestTimers[exerciseId].interval){
      clearInterval(activeRestTimers[exerciseId].interval);
    }
    activeRestTimers[exerciseId] = { endTime: Date.now() + seconds*1000, seconds, paused: false, pausedRemaining: null, interval: null };
    renderTimerBox(exerciseId);
    runTimerInterval(exerciseId);
    if('Notification' in window && Notification.permission === 'granted'){
      scheduleRestNotification(seconds);
    }
  }

  function renderTimerBox(exerciseId){
    const box = document.getElementById('fr-ex-timer-box-'+exerciseId);
    const state = activeRestTimers[exerciseId];
    if(!box || !state) return;
    const remaining = state.paused ? state.pausedRemaining : Math.max(0, Math.ceil((state.endTime - Date.now())/1000));
    box.innerHTML = `
      <div class="fr-timer-box">
        <div class="fr-timer-num" id="fr-timer-num-${exerciseId}">${formatTimer(remaining)}</div>
        <div class="fr-timer-label">${state.paused ? 'pausado' : 'descansando'}</div>
        <div class="fr-timer-controls">
          <button type="button" class="fr-timer-btn" id="fr-timer-pause-${exerciseId}">${state.paused ? '▶ Continuar' : '⏸ Pausar'}</button>
          <button type="button" class="fr-timer-btn" id="fr-timer-restart-${exerciseId}">↺ Reiniciar</button>
        </div>
      </div>`;
    document.getElementById(`fr-timer-pause-${exerciseId}`).addEventListener('click', ()=> toggleTimerPause(exerciseId));
    document.getElementById(`fr-timer-restart-${exerciseId}`).addEventListener('click', ()=> restartTimer(exerciseId));
  }

  function finishRestTimer(exerciseId, state){
    clearInterval(state.interval);
    const box = document.getElementById('fr-ex-timer-box-'+exerciseId);
    if(box){
      box.innerHTML = `<div class="fr-timer-box"><div class="fr-timer-num" style="color:var(--rust)">Descanso concluído!</div><button type="button" class="fr-timer-btn" id="fr-timer-again-${exerciseId}" style="margin-top:8px;">↺ Descansar de novo</button></div>`;
      const again = document.getElementById(`fr-timer-again-${exerciseId}`);
      if(again) again.addEventListener('click', ()=> startRestTimer(exerciseId, state.seconds));
    }
    playTimerEndSound();
    if('Notification' in window && Notification.permission === 'granted'){
      try{ new Notification('Descanso concluído!', { body: 'Hora de voltar pro treino.', icon: 'icon-192.png' }); }catch(e){}
    }
    delete activeRestTimers[exerciseId];
  }

  function runTimerInterval(exerciseId){
    const state = activeRestTimers[exerciseId];
    if(!state) return;
    state.interval = setInterval(()=>{
      const s = activeRestTimers[exerciseId];
      if(!s){ clearInterval(state.interval); return; }
      if(s.paused) return;
      const numEl = document.getElementById('fr-timer-num-'+exerciseId);
      if(!numEl){ clearInterval(s.interval); delete activeRestTimers[exerciseId]; return; }
      const remaining = Math.max(0, Math.ceil((s.endTime - Date.now())/1000));
      if(remaining <= 0){
        finishRestTimer(exerciseId, s);
        return;
      }
      numEl.textContent = formatTimer(remaining);
    }, 1000);
  }

  // Quando a pessoa volta pro app (troca de aba/aplicativo e retorna, ou destrava a tela),
  // recalcula todos os cronômetros ativos na hora — corrige sozinho qualquer atraso
  // causado pelo navegador pausando a contagem enquanto estava em segundo plano.
  document.addEventListener('visibilitychange', ()=>{
    if(document.visibilityState !== 'visible') return;
    Object.keys(activeRestTimers).forEach(exerciseId=>{
      const state = activeRestTimers[exerciseId];
      if(!state || state.paused) return;
      const remaining = Math.max(0, Math.ceil((state.endTime - Date.now())/1000));
      if(remaining <= 0){
        finishRestTimer(exerciseId, state);
      } else {
        const numEl = document.getElementById('fr-timer-num-'+exerciseId);
        if(numEl) numEl.textContent = formatTimer(remaining);
      }
    });
  });

  function toggleTimerPause(exerciseId){
    const state = activeRestTimers[exerciseId];
    if(!state) return;
    if(state.paused){
      state.endTime = Date.now() + state.pausedRemaining*1000;
      state.paused = false;
      state.pausedRemaining = null;
    } else {
      state.pausedRemaining = Math.max(0, Math.ceil((state.endTime - Date.now())/1000));
      state.paused = true;
    }
    renderTimerBox(exerciseId);
  }

  function restartTimer(exerciseId){
    const state = activeRestTimers[exerciseId];
    if(!state) return;
    state.endTime = Date.now() + state.seconds*1000;
    state.paused = false;
    state.pausedRemaining = null;
    renderTimerBox(exerciseId);
    if('Notification' in window && Notification.permission === 'granted'){
      scheduleRestNotification(state.seconds);
    }
  }

  function requestNotificationPermission(){
    if(!('Notification' in window)){
      showToast('Esse navegador não suporta notificações.', 'err');
      return;
    }
    Notification.requestPermission().then(perm=>{
      if(perm === 'granted'){
        showToast('Notificações ativadas!', 'ok');
      } else if(perm === 'denied'){
        showToast('Permissão negada — pode reativar nas configurações do navegador.', 'err');
      }
      if(currentView==='settings') renderSettingsView();
    });
  }

  /* ---------- Cardio: cronômetro com estimativa de calorias ---------- */
  // Referência de MET (Metabolic Equivalent of Task) pra cada opção da
  // biblioteca "Treino de Cardio" (ver cardio_seed.sql) — valores médios
  // de intensidade moderada, do Compêndio de Atividades Físicas (fonte
  // científica padrão). Cálculo: kcal = MET * 3.5 * peso_kg / 200 * min.
  // Sem peso cadastrado no perfil, assume 70kg. São estimativas gerais,
  // não uma medição real (tipo um relógio com frequência cardíaca) —
  // servem pra ter uma ideia, não um número exato.
  const CARDIO_MET = {
    'Caminhada rápida': 4.5,
    'Corrida (esteira ou rua)': 9.0,
    'Bicicleta ergométrica': 7.0,
    'Elíptico (transport)': 5.0,
    'Pular corda': 8.8,
    'Subir escada / step': 8.0,
    'HIIT (intervalado de alta intensidade)': 8.0,
    'Natação': 6.0,
    'Remo (ergômetro)': 7.0,
    'Bicicleta ao ar livre': 7.5,
  };
  const CARDIO_MET_DEFAULT = 6.0; // pra qualquer opção nova que alguém adicionar na biblioteca e não esteja na lista acima

  function cardioKcalPerMinute(exerciseName){
    const met = (exerciseName in CARDIO_MET) ? CARDIO_MET[exerciseName] : CARDIO_MET_DEFAULT;
    const weight = (currentProfile && currentProfile.weight_kg) ? Number(currentProfile.weight_kg) : 70;
    return (met * 3.5 * weight) / 200;
  }

  // Sessão de cardio ativa — null quando nenhuma está rodando. Guardada
  // também no localStorage (saveCardioToStorage/restoreCardioFromStorage)
  // pra sobreviver a um recarregamento de página, do mesmo jeito que os
  // cronômetros de descanso se auto-corrigem ao voltar pro app; mas,
  // diferente deles, continua contando por trás mesmo com a tela do
  // cardio fechada — só não atualiza o número na tela até reabrir.
  let activeCardio = null; // { name, startedAt, paused, pausedElapsed, interval }
  const CARDIO_STORAGE_KEY = 'saber_active_cardio';

  function saveCardioToStorage(){
    try{
      if(!activeCardio){ localStorage.removeItem(CARDIO_STORAGE_KEY); return; }
      localStorage.setItem(CARDIO_STORAGE_KEY, JSON.stringify({
        name: activeCardio.name, startedAt: activeCardio.startedAt,
        paused: activeCardio.paused, pausedElapsed: activeCardio.pausedElapsed,
        targetSeconds: activeCardio.targetSeconds, notifiedDone: activeCardio.notifiedDone,
      }));
    }catch(e){}
  }
  function restoreCardioFromStorage(){
    try{
      const raw = localStorage.getItem(CARDIO_STORAGE_KEY);
      if(!raw) return;
      const saved = JSON.parse(raw);
      if(!saved || !saved.name || !saved.startedAt) return;
      activeCardio = {
        name: saved.name, startedAt: saved.startedAt, paused: !!saved.paused, pausedElapsed: saved.pausedElapsed || 0,
        targetSeconds: saved.targetSeconds || null, notifiedDone: !!saved.notifiedDone, interval: null,
      };
    }catch(e){}
  }

  function cardioElapsedSeconds(){
    if(!activeCardio) return 0;
    if(activeCardio.paused) return activeCardio.pausedElapsed;
    return activeCardio.pausedElapsed + Math.floor((Date.now() - activeCardio.startedAt)/1000);
  }

  // Quando a pessoa escolhe treinar por um tempo específico (em vez do
  // cronômetro livre), isso aqui é o que falta pra acabar — null quando
  // não tem tempo definido (modo cronômetro livre).
  function cardioRemainingSeconds(){
    if(!activeCardio || activeCardio.targetSeconds == null) return null;
    return Math.max(0, activeCardio.targetSeconds - cardioElapsedSeconds());
  }

  // Toca o som e dispara uma notificação local (igual ao cronômetro de
  // descanso) na hora exata em que o tempo escolhido se esgota. Só
  // funciona enquanto o app estiver aberto/rodando (mesmo em segundo
  // plano) — diferente do aviso de descanso, não dá pra agendar uma
  // notificação push de verdade pra isso, porque a função do servidor
  // que envia push só segura por até ~140 segundos, e um cardio costuma
  // durar bem mais que isso.
  function notifyCardioDone(){
    playTimerEndSound();
    if('Notification' in window && Notification.permission === 'granted'){
      try{ new Notification('Tempo de cardio concluído!', { body: `${activeCardio.name} — hora de finalizar ou continuar por conta própria.`, icon: 'icon-192.png' }); }catch(e){}
    }
  }

  function openCardioModal(){
    if(activeCardio){ renderCardioRunning(); return; }
    const cardioOptions = (groupLibraryByMuscle()['Treino de Cardio'] || []);
    const overlay = buildOverlay(`
      <h3 class="fr-form-title">🏃 Cardio</h3>
      <p class="fr-hint" style="margin-bottom:14px;">Escolha o que você vai fazer — o cronômetro já inicia, e a estimativa de calorias vai subindo junto.</p>
      <div id="fr-cardio-pick-list">
        ${cardioOptions.length ? cardioOptions.map(e=>`
          <div class="fr-cardio-pick-row" data-name="${esc(e.name)}" tabindex="0" role="button">
            <span class="name">${esc(e.name)}</span>
            <small>~${cardioKcalPerMinute(e.name).toFixed(1)} kcal/min</small>
          </div>`).join('') : `<p class="fr-hint">Nenhuma opção de cardio cadastrada ainda na biblioteca.</p>`}
      </div>
      <button type="button" class="fr-btn-ghost" id="fr-cardio-history-toggle" style="width:100%;margin-top:10px;">Ver histórico de cardio</button>
      <div id="fr-cardio-history-box"></div>
    `);
    overlay.querySelectorAll('.fr-cardio-pick-row').forEach(row=>{
      const open = ()=> openCardioModeChooser(row.getAttribute('data-name'));
      row.addEventListener('click', open);
      row.addEventListener('keydown', e=>{ if(e.key==='Enter') open(); });
    });
    overlay.querySelector('#fr-cardio-history-toggle').addEventListener('click', toggleCardioHistory);
  }

  // Tela intermediária entre escolher o tipo de cardio e começar: pode
  // iniciar um cronômetro livre (conta o tempo todo, sem fim definido)
  // ou escolher treinar por um tempo específico em minutos — nesse
  // caso, ao bater o tempo, toca um som e avisa, sem precisar ficar
  // olhando pra tela o tempo todo.
  function openCardioModeChooser(name){
    const kcalMin = cardioKcalPerMinute(name);
    const overlay = buildOverlay(`
      <h3 class="fr-form-title">🏃 ${esc(name)}</h3>
      <p class="fr-hint" style="margin-bottom:14px;">~${kcalMin.toFixed(1)} kcal/min estimado.</p>
      <button type="button" class="fr-btn-primary" id="fr-cardio-start-free" style="width:100%;margin-bottom:14px;">⏱ Iniciar cronômetro livre</button>
      <div class="fr-field">
        <label for="fr-cardio-minutes">Ou treinar por um tempo específico (minutos)</label>
        <div style="display:flex;gap:8px;">
          <input type="number" min="1" max="600" id="fr-cardio-minutes" placeholder="ex.: 20" style="flex:1;">
          <button type="button" class="fr-btn-ghost" id="fr-cardio-start-timer">⏰ Iniciar</button>
        </div>
        <p class="fr-hint" style="margin-top:6px;">Quando o tempo acabar, toca um som e mostra um aviso — mas isso só funciona com o app aberto (mesmo que em segundo plano); se você fechar o Saber de vez, o aviso não chega.</p>
      </div>
      <button type="button" class="fr-btn-ghost" id="fr-cardio-mode-back" style="width:100%;margin-top:14px;">← Voltar</button>
    `);
    overlay.querySelector('#fr-cardio-start-free').addEventListener('click', ()=> startCardio(name, null));
    overlay.querySelector('#fr-cardio-start-timer').addEventListener('click', function(){
      const minutes = parseFloat(document.getElementById('fr-cardio-minutes').value);
      if(!minutes || minutes <= 0){ showToast('Informe quantos minutos.', 'err'); return; }
      startCardio(name, Math.round(minutes*60));
    });
    overlay.querySelector('#fr-cardio-mode-back').addEventListener('click', openCardioModal);
  }

  function startCardio(name, targetSeconds){
    unlockAudio();
    activeCardio = { name, startedAt: Date.now(), paused: false, pausedElapsed: 0, targetSeconds: targetSeconds || null, notifiedDone: false, interval: null };
    saveCardioToStorage();
    renderCardioRunning();
  }

  function cardioTimerLabel(){
    if(activeCardio.paused) return 'pausado';
    if(activeCardio.targetSeconds != null){
      return cardioRemainingSeconds() <= 0 ? 'tempo concluído! pode finalizar ou continuar' : 'restando';
    }
    return 'em andamento';
  }

  function renderCardioRunning(){
    const isCountdown = activeCardio.targetSeconds != null;
    const displaySecs = isCountdown ? cardioRemainingSeconds() : cardioElapsedSeconds();
    const overlay = buildOverlay(`
      <h3 class="fr-form-title">🏃 ${esc(activeCardio.name)}</h3>
      <div class="fr-cardio-timer-box">
        <div class="fr-cardio-timer-num" id="fr-cardio-timer-num">${formatTimer(displaySecs)}</div>
        <div class="fr-cardio-timer-label" id="fr-cardio-timer-label">${cardioTimerLabel()}</div>
        <div class="fr-cardio-kcal" id="fr-cardio-kcal">🔥 ~${Math.round(cardioElapsedSeconds()/60*cardioKcalPerMinute(activeCardio.name))} kcal</div>
      </div>
      <div class="fr-cardio-controls">
        <button type="button" class="fr-timer-btn" id="fr-cardio-pause">${activeCardio.paused ? '▶ Continuar' : '⏸ Pausar'}</button>
        <button type="button" class="fr-btn-primary" id="fr-cardio-finish">■ Finalizar e salvar</button>
      </div>
      <button type="button" class="fr-btn-ghost" id="fr-cardio-cancel" style="width:100%;margin-top:12px;">Cancelar sessão (não salvar)</button>
    `);
    if(activeCardio.interval) clearInterval(activeCardio.interval);
    activeCardio.interval = setInterval(updateCardioTimerDisplay, 1000);
    overlay.querySelector('#fr-cardio-pause').addEventListener('click', toggleCardioPause);
    overlay.querySelector('#fr-cardio-finish').addEventListener('click', finishCardio);
    overlay.querySelector('#fr-cardio-cancel').addEventListener('click', cancelCardio);
  }

  function updateCardioTimerDisplay(){
    if(!activeCardio) return;
    if(activeCardio.paused) return;
    // Mesmo sem a tela do cardio aberta, continua verificando se o tempo
    // escolhido acabou, pra disparar o aviso sonoro/notificação na hora certa.
    if(activeCardio.targetSeconds != null && !activeCardio.notifiedDone && cardioRemainingSeconds() <= 0){
      activeCardio.notifiedDone = true;
      saveCardioToStorage();
      notifyCardioDone();
    }
    const numEl = document.getElementById('fr-cardio-timer-num');
    if(!numEl) return; // tela do cardio não tá aberta agora — a sessão continua contando sozinha
    const isCountdown = activeCardio.targetSeconds != null;
    const secs = cardioElapsedSeconds();
    numEl.textContent = formatTimer(isCountdown ? cardioRemainingSeconds() : secs);
    const labelEl = document.getElementById('fr-cardio-timer-label');
    if(labelEl) labelEl.textContent = cardioTimerLabel();
    const kcalEl = document.getElementById('fr-cardio-kcal');
    if(kcalEl) kcalEl.textContent = `🔥 ~${Math.round(secs/60*cardioKcalPerMinute(activeCardio.name))} kcal`;
  }

  // Mesma lógica dos cronômetros de descanso: ao voltar pro app depois
  // de trocar de aba/aplicativo, recalcula na hora pra corrigir qualquer
  // atraso do navegador pausando a contagem em segundo plano.
  document.addEventListener('visibilitychange', ()=>{
    if(document.visibilityState !== 'visible' || !activeCardio) return;
    updateCardioTimerDisplay();
  });

  function toggleCardioPause(){
    if(!activeCardio) return;
    if(activeCardio.paused){
      activeCardio.startedAt = Date.now();
      activeCardio.paused = false;
    } else {
      activeCardio.pausedElapsed = cardioElapsedSeconds();
      activeCardio.paused = true;
    }
    saveCardioToStorage();
    renderCardioRunning();
  }

  async function finishCardio(){
    if(!activeCardio) return;
    const btn = document.getElementById('fr-cardio-finish');
    if(btn){ btn.disabled = true; btn.textContent = 'Salvando...'; }
    if(activeCardio.interval) clearInterval(activeCardio.interval);
    const durationSeconds = cardioElapsedSeconds();
    const name = activeCardio.name;
    const kcal = Math.round((durationSeconds/60) * cardioKcalPerMinute(name));
    const date = todayStr();
    try{
      const { error: insErr } = await sb.from('cardio_sessions').insert({
        user_id: currentUser.id, exercise_name: name, duration_seconds: durationSeconds, calories: kcal, date,
      });
      if(insErr) throw insErr;
      const { data: existing } = await sb.from('calories_burned_logs').select('amount').eq('user_id', currentUser.id).eq('date', date).maybeSingle();
      const newAmount = (existing ? Number(existing.amount) : 0) + kcal;
      const { error: upErr } = await sb.from('calories_burned_logs').upsert({ user_id: currentUser.id, date, amount: newAmount }, { onConflict: 'user_id,date' });
      if(upErr) throw upErr;
      if(date === currentDate){ currentDayCaloriesBurned = newAmount; if(currentView==='diary') renderSummary(); }
      activeCardio = null;
      saveCardioToStorage();
      showToast(`Cardio registrado! ${formatTimer(durationSeconds)} · ~${kcal} kcal`, 'ok');
      closeOverlay();
    }catch(err){
      console.error(err);
      showToast('Não foi possível salvar o cardio agora. Tente novamente.', 'err');
      if(btn){ btn.disabled = false; btn.textContent = '■ Finalizar e salvar'; }
      if(activeCardio) activeCardio.interval = setInterval(updateCardioTimerDisplay, 1000);
    }
  }

  function cancelCardio(){
    if(activeCardio && activeCardio.interval) clearInterval(activeCardio.interval);
    activeCardio = null;
    saveCardioToStorage();
    showToast('Sessão de cardio cancelada.', 'ok');
    closeOverlay();
  }

  async function toggleCardioHistory(){
    const box = document.getElementById('fr-cardio-history-box');
    if(!box) return;
    if(box.innerHTML){ box.innerHTML = ''; return; }
    box.innerHTML = `<div class="fr-loading" style="margin:10px 0;">Carregando histórico...</div>`;
    const { data, error } = await sb.from('cardio_sessions').select('*').eq('user_id', currentUser.id).order('created_at', {ascending:false}).limit(20);
    if(error || !data || data.length===0){ box.innerHTML = `<p class="fr-hint">Nenhuma sessão de cardio registrada ainda.</p>`; return; }
    box.innerHTML = data.map(s=> `<div class="fr-session-hist-row"><span>${esc(formatDateLabel(s.date))} · ${esc(s.exercise_name)}</span><b>${formatTimer(s.duration_seconds||0)} · ${Math.round(s.calories||0)}kcal</b></div>`).join('');
  }

  function openSubmissionForm(exerciseId){
    const overlay = buildOverlay(`
      <h3 class="fr-form-title">Enviar meu vídeo</h3>
      <form id="fr-sub-form">
        <div class="fr-field"><label for="fr-sub-url">Link do vídeo (YouTube não-listado, Google Drive, etc.)</label><input type="url" id="fr-sub-url" required placeholder="https://..."></div>
        <div class="fr-field"><label for="fr-sub-notes">Observação (opcional)</label><textarea id="fr-sub-notes" style="min-height:60px"></textarea></div>
        <div class="fr-form-actions">
          <button type="button" class="fr-btn-ghost" id="fr-sub-cancel">Cancelar</button>
          <button type="submit" class="fr-btn-primary">Enviar</button>
        </div>
      </form>
    `);
    overlay.querySelector('#fr-sub-cancel').addEventListener('click', closeOverlay);
    overlay.querySelector('#fr-sub-form').addEventListener('submit', async function(e){
      e.preventDefault();
      const btn = overlay.querySelector('button[type="submit"]');
      const url = document.getElementById('fr-sub-url').value.trim();
      if(!url){ document.getElementById('fr-sub-url').focus(); return; }
      const notes = document.getElementById('fr-sub-notes').value;
      btn.disabled = true; btn.textContent = 'Enviando...';
      const { error } = await sb.from('exercise_submissions').insert({ exercise_id: exerciseId, user_id: currentUser.id, video_url: url, notes });
      if(error){ showToast('Não foi possível enviar. Tente novamente.', 'err'); btn.disabled=false; btn.textContent='Enviar'; return; }
      showToast('Vídeo enviado.', 'ok');
      closeOverlay();
    });
  }

  function openWorkoutFormModal(existing){
    const isEdit = !!existing;
    const w = existing || { name:'', notes:'', assigned_to_user_id:null };
    const assigneeOptions = myClients.map(c=>`<option value="${c.client_id}" ${w.assigned_to_user_id===c.client_id?'selected':''}>${esc(c.email)}</option>`).join('');
    const overlay = buildOverlay(`
      <h3 class="fr-form-title">${isEdit ? 'Editar treino' : 'Novo treino'}</h3>
      <form id="fr-wk-form">
        <div class="fr-field"><label for="fr-wk-name">Nome do treino</label><input type="text" id="fr-wk-name" required value="${esc(w.name)}" placeholder="ex.: Treino A — Superiores"></div>
        <div class="fr-field"><label for="fr-wk-assignee">Pra quem é</label>
          <select id="fr-wk-assignee">
            <option value="">Geral (todo mundo vê)</option>
            ${assigneeOptions}
          </select>
        </div>
        <div class="fr-field"><label for="fr-wk-notes">Observações</label><textarea id="fr-wk-notes" style="min-height:60px">${esc(w.notes||'')}</textarea></div>
        <div class="fr-form-actions">
          <button type="button" class="fr-btn-ghost" id="fr-wk-cancel">Cancelar</button>
          <button type="submit" class="fr-btn-primary">${isEdit ? 'Salvar' : 'Salvar e continuar'}</button>
        </div>
      </form>
    `);
    overlay.querySelector('#fr-wk-cancel').addEventListener('click', closeOverlay);
    overlay.querySelector('#fr-wk-form').addEventListener('submit', async function(e){
      e.preventDefault();
      const btn = overlay.querySelector('button[type="submit"]');
      const name = document.getElementById('fr-wk-name').value.trim();
      if(!name){ document.getElementById('fr-wk-name').focus(); return; }
      const payload = {
        name,
        assigned_to_user_id: document.getElementById('fr-wk-assignee').value || null,
        notes: document.getElementById('fr-wk-notes').value
      };
      btn.disabled = true; btn.textContent = 'Salvando...';
      try{
        let workoutId;
        if(isEdit){
          const { error } = await sb.from('workouts').update(payload).eq('id', w.id);
          if(error) throw error;
          workoutId = w.id;
          workouts = workouts.map(x=> x.id===w.id ? {...x, ...payload} : x);
        } else {
          payload.created_by = currentUser.id;
          const { data, error } = await sb.from('workouts').insert(payload).select().single();
          if(error) throw error;
          workoutId = data.id;
          workouts.unshift(data);
        }
        showToast('Treino salvo.', 'ok');
        closeOverlay();
        openWorkoutExerciseManager(workoutId, name);
      }catch(err){
        console.error(err);
        showToast('Não foi possível salvar agora. Tente novamente.', 'err');
        btn.disabled = false;
        btn.textContent = isEdit ? 'Salvar' : 'Salvar e continuar';
      }
    });
  }

  async function openWorkoutExerciseManager(workoutId, workoutName){
    const w = workouts.find(x=>x.id===workoutId);
    const isLibraryWorkout = w && w.assigned_to_user_id === null;
    await loadExerciseLibrary();
    const cardioOptions = (groupLibraryByMuscle()['Treino de Cardio'] || []);
    const overlay = buildOverlay(`
      <h3 class="fr-form-title">Exercícios</h3>
      <div class="fr-field"><label for="fr-wkex-name">Nome do treino</label>
        <div style="display:flex;gap:8px;">
          <input type="text" id="fr-wkex-name" value="${esc(workoutName)}" style="flex:1;">
          <button class="fr-btn-ghost" id="fr-wkex-rename-save" style="flex:0 0 auto;">Salvar</button>
        </div>
      </div>
      <button class="fr-btn-primary" id="fr-wkex-add" style="width:100%;margin-bottom:10px;">${PLUS_SVG} Adicionar exercício</button>
      ${cardioOptions.length ? `<button class="fr-btn-ghost" id="fr-wkex-add-cardio-toggle" style="width:100%;margin-bottom:16px;">🏃 Adicionar cardio no final (10-15min)</button>
      <div id="fr-wkex-cardio-picker" style="display:none;margin-bottom:16px;">
        <select id="fr-wkex-cardio-select">
          ${cardioOptions.map(e=>`<option value="${e.id}">${esc(e.name)}</option>`).join('')}
        </select>
        <button class="fr-btn-primary" id="fr-wkex-cardio-confirm" style="width:100%;margin-top:8px;">Adicionar</button>
      </div>` : ''}
      <div id="fr-wkex-list"><div class="fr-loading">Carregando...</div></div>
      <button class="fr-btn-ghost" id="fr-wkex-done" style="width:100%;margin-top:14px;">Concluir</button>
      ${isLibraryWorkout ? `<p class="fr-hint" style="margin-top:14px;">Este é um treino de referência da biblioteca — não pode ser excluído por aqui, só editado (adicionar/editar exercícios).</p>` : `
      <div id="fr-wkex-delete-area" style="margin-top:18px;padding-top:16px;border-top:1px solid var(--border);">
        <button class="fr-btn-danger" id="fr-wkex-delete-workout" style="width:100%;">Excluir este treino inteiro</button>
      </div>`}
    `);
    overlay.querySelector('#fr-wkex-done').addEventListener('click', ()=>{ closeOverlay(); loadWorkouts(); });
    overlay.querySelector('#fr-wkex-rename-save').addEventListener('click', async function(){
      const btn = this;
      const newName = document.getElementById('fr-wkex-name').value.trim();
      if(!newName){ showToast('O nome não pode ficar vazio.', 'err'); return; }
      btn.disabled = true; btn.textContent = 'Salvando...';
      const { error } = await sb.from('workouts').update({ name: newName }).eq('id', workoutId);
      btn.disabled = false; btn.textContent = 'Salvar';
      if(error){ showToast('Erro: ' + (error.message || JSON.stringify(error)), 'err'); return; }
      showToast('Nome atualizado!', 'ok');
      workoutName = newName;
      loadWorkouts();
    });
    overlay.querySelector('#fr-wkex-add').addEventListener('click', ()=> openExerciseFormModal(workoutId, workoutName, null));
    const cardioToggle = overlay.querySelector('#fr-wkex-add-cardio-toggle');
    if(cardioToggle){
      cardioToggle.addEventListener('click', ()=>{
        const picker = overlay.querySelector('#fr-wkex-cardio-picker');
        picker.style.display = picker.style.display==='none' ? '' : 'none';
      });

  // OCR gratuito (roda no navegador, sem API paga) pra ler uma foto de exercício
  // e pré-preencher o formulário. Carrega a biblioteca só quando o botão é usado,
  // pra não pesar o carregamento do app pra quem nunca usa essa função.
  let __tesseractLoadPromise = null;
  function loadTesseract(){
    if(window.Tesseract) return Promise.resolve();
    if(__tesseractLoadPromise) return __tesseractLoadPromise;
    __tesseractLoadPromise = new Promise((resolve, reject)=>{
      const s = document.createElement('script');
      s.src = 'https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js';
      s.onload = ()=> resolve();
      s.onerror = ()=> { __tesseractLoadPromise = null; reject(new Error('Falha ao carregar OCR')); };
      document.head.appendChild(s);
    });
    return __tesseractLoadPromise;
  }

  // Tenta adivinhar nome/séries/repetições/descanso a partir do texto bruto
  // reconhecido na foto. É uma heurística simples (sem IA paga) — por isso o
  // resultado sempre fica pra revisão da pessoa antes de salvar.
  function guessExerciseFromOcrText(text){
    const lines = (text||'').split('\n').map(l=> l.replace(/\s+/g,' ').trim()).filter(l=> l.length>0);
    const labelRe = /^(s[ée]ries?|repeti[çc][õo]es?|descanso|intervalo|carga|tempo|instru[çc][õo]es?)\b[:\s]/i;
    let sets = null, reps = null, rest_seconds = null, name = null;
    for(const line of lines){
      if(sets==null){
        const nx = line.match(/(\d{1,2})\s*[x×]\s*(\d{1,3}(?:\s*-\s*\d{1,3})?)/);
        if(nx){ sets = nx[1]; reps = nx[2].replace(/\s+/g,''); }
      }
      if(rest_seconds==null){
        const restM = line.match(/(?:descanso|intervalo|desc\.?|rest)[:\s]*(\d{1,3})\s*(s|seg|min)?/i);
        if(restM){
          let v = parseInt(restM[1],10);
          if(/min/i.test(restM[2]||'')) v = v*60;
          rest_seconds = v;
        }
      }
    }
    for(const line of lines){
      if(labelRe.test(line)) continue;
      if(/^[\d\sx×\-.,:]+$/i.test(line)) continue;
      if(line.length < 3 || line.length > 60) continue;
      name = line;
      break;
    }
    return { name, sets, reps, rest_seconds, notes: name ? null : lines.slice(0,8).join('\n') };
  }

      <input type="text" class="fr-exd-carga" placeholder="carga (ex.: 20kg)" value="${esc(r.carga||'')}">
      <input type="text" class="fr-exd-tempo" placeholder="tempo (opcional)" value="${esc(r.tempo||'')}">
      <input type="number" min="0" class="fr-exd-rest" placeholder="descanso (s)" value="${r.rest_seconds ?? ''}">
      <button type="button" class="fr-btn-ghost fr-exd-remove" aria-label="Remover série">✕</button>
    </div>`;
  }
  function renumberExDetailRows(container){
    container.querySelectorAll('.fr-exd-row').forEach((row, i)=>{
      row.setAttribute('data-idx', i);
      row.querySelector('.fr-exd-num').textContent = `Série ${i+1}`;
    });
  }

  function openExerciseFormModal(workoutId, workoutName, existing){
    const isEdit = !!existing;
    const ex = existing || { name:'', sets:'', reps:'', rest_seconds:'', video_url:'', notes:'', sets_detail:null };
    const catalog = exerciseLibrary.length ? exerciseLibrary : [];
    const uniqueByName = new Map();
    catalog.forEach(e=>{ if(!uniqueByName.has(e.name)) uniqueByName.set(e.name, e); });
    const hasExistingDetail = Array.isArray(ex.sets_detail) && ex.sets_detail.length > 0;
    const overlay = buildOverlay(`
      <h3 class="fr-form-title">${isEdit ? 'Editar' : 'Novo'} exercício</h3>
      ${!isEdit ? `
      <button type="button" class="fr-btn-ghost" id="fr-ex-ocr-btn" style="width:100%;margin-bottom:6px;">📷 Preencher tirando uma foto (beta)</button>
      <input type="file" id="fr-ex-ocr-file" accept="image/*" capture="environment" style="display:none;">
      <div id="fr-ex-ocr-status" class="fr-hint" style="display:none;margin-bottom:12px;"></div>
      ` : ''}
      <form id="fr-exform">
        <div class="fr-field"><label for="fr-ex-name">Nome do exercício</label>
          <input type="text" id="fr-ex-name" required value="${esc(ex.name)}" list="fr-ex-catalog" autocomplete="off" placeholder="Digite pra buscar no catálogo...">
          <datalist id="fr-ex-catalog">
            ${Array.from(uniqueByName.keys()).map(n=>`<option value="${esc(n)}">`).join('')}
          </datalist>
          <p class="fr-hint" style="margin-top:4px;">Se o nome bater com um exercício já cadastrado, os campos abaixo preenchem sozinhos.</p>
        </div>
        <div class="fr-row4" id="fr-ex-simple-fields" style="${hasExistingDetail ? 'display:none;' : ''}">
          <div class="fr-field"><label for="fr-ex-sets">Séries</label><input type="number" min="0" id="fr-ex-sets" value="${esc(ex.sets ?? '')}"></div>
          <div class="fr-field"><label for="fr-ex-reps">Repetições</label><input type="text" id="fr-ex-reps" placeholder="ex.: 10-12" value="${esc(ex.reps||'')}"></div>
          <div class="fr-field"><label for="fr-ex-rest">Descanso (s)</label><input type="number" min="0" id="fr-ex-rest" value="${esc(ex.rest_seconds ?? '')}"></div>
        </div>
        <div class="fr-toggle-row">
          <span class="fr-toggle-row-label">Personalizar cada série (reps, carga, tempo e descanso diferentes por série — como na tela de treinar)</span>
          <label class="fr-toggle">
            <input type="checkbox" id="fr-ex-detail-toggle" ${hasExistingDetail ? 'checked' : ''}>
            <span class="fr-toggle-track"><span class="fr-toggle-thumb"></span></span>
          </label>
        </div>
        <div id="fr-ex-detail-section" style="${hasExistingDetail ? '' : 'display:none;'}margin-bottom:14px;">
          <div id="fr-ex-detail-rows"></div>
          <button type="button" class="fr-btn-ghost" id="fr-ex-detail-add" style="width:100%;margin-top:4px;">+ Adicionar série</button>
        </div>
        <div class="fr-field"><label for="fr-ex-video">Link do vídeo de demonstração</label><input type="url" id="fr-ex-video" placeholder="https://..." value="${esc(ex.video_url||'')}"></div>
        <div class="fr-field"><label for="fr-ex-notes">Observações</label><textarea id="fr-ex-notes" style="min-height:50px">${esc(ex.notes||'')}</textarea></div>
        <div class="fr-form-actions">
          ${isEdit ? '<button type="button" class="fr-btn-danger" id="fr-ex-delete">Excluir</button>' : '<button type="button" class="fr-btn-ghost" id="fr-ex-back">Voltar</button>'}
          <button type="submit" class="fr-btn-primary">${isEdit ? 'Salvar' : 'Adicionar'}</button>
        </div>
      </form>
    `);

    // ---- Detalhe por série (manual) ----
    const detailRowsEl = overlay.querySelector('#fr-ex-detail-rows');
    const detailToggle = overlay.querySelector('#fr-ex-detail-toggle');
    const detailSection = overlay.querySelector('#fr-ex-detail-section');
    const simpleFields = overlay.querySelector('#fr-ex-simple-fields');
    function addExDetailRow(row){
      const idx = detailRowsEl.children.length;
      detailRowsEl.insertAdjacentHTML('beforeend', exDetailRowHtml(row, idx));
      const newRow = detailRowsEl.lastElementChild;
      newRow.querySelector('.fr-exd-remove').addEventListener('click', ()=>{ newRow.remove(); renumberExDetailRows(detailRowsEl); });
    }
    function syncDetailVisibility(){
      const on = detailToggle.checked;
      detailSection.style.display = on ? '' : 'none';
      simpleFields.style.display = on ? 'none' : '';
      if(on && detailRowsEl.children.length===0){
        addExDetailRow({}); addExDetailRow({}); addExDetailRow({});
      }
    }
    (Array.isArray(ex.sets_detail) ? ex.sets_detail : []).forEach(r=> addExDetailRow(r));
    detailToggle.addEventListener('change', syncDetailVisibility);
    overlay.querySelector('#fr-ex-detail-add').addEventListener('click', ()=> addExDetailRow({}));

    overlay.querySelector('#fr-ex-name').addEventListener('input', function(){
      const match = uniqueByName.get(this.value);
      if(!match) return;
      document.getElementById('fr-ex-sets').value = match.sets ?? '';
      document.getElementById('fr-ex-reps').value = match.reps || '';
      document.getElementById('fr-ex-rest').value = match.rest_seconds ?? '';
      document.getElementById('fr-ex-video').value = match.video_url || '';
      document.getElementById('fr-ex-notes').value = match.notes || '';
      // Também copia o detalhe por série, se o exercício do catálogo tiver.
      detailRowsEl.innerHTML = '';
      const matchDetail = Array.isArray(match.sets_detail) ? match.sets_detail : [];
      matchDetail.forEach(r=> addExDetailRow(r));
      detailToggle.checked = matchDetail.length > 0;
      syncDetailVisibility();
    });
    const ocrBtn = overlay.querySelector('#fr-ex-ocr-btn');
    if(ocrBtn){
      const ocrFile = overlay.querySelector('#fr-ex-ocr-file');
      const ocrStatus = overlay.querySelector('#fr-ex-ocr-status');
      ocrBtn.addEventListener('click', ()=> ocrFile.click());
      ocrFile.addEventListener('change', async function(){
        const file = this.files[0];
        if(!file) return;
        ocrStatus.style.display = '';
        ocrStatus.textContent = 'Lendo a foto... isso pode levar alguns segundos.';
        ocrBtn.disabled = true;
        try{
          await loadTesseract();
          const { data } = await Tesseract.recognize(file, 'por');
          const guess = guessExerciseFromOcrText(data.text || '');
          if(guess.name) document.getElementById('fr-ex-name').value = guess.name;
          if(guess.sets != null) document.getElementById('fr-ex-sets').value = guess.sets;
          if(guess.reps) document.getElementById('fr-ex-reps').value = guess.reps;
          if(guess.rest_seconds != null) document.getElementById('fr-ex-rest').value = guess.rest_seconds;
          const notesEl = document.getElementById('fr-ex-notes');
          if(!notesEl.value && guess.notes) notesEl.value = guess.notes;
          ocrStatus.textContent = guess.name
            ? 'Preenchi os campos com o que consegui ler — confira tudo antes de salvar, a leitura por foto pode errar.'
            : 'Não consegui identificar o exercício com clareza — preencha ou corrija os campos manualmente.';
        }catch(err){
          console.error(err);
          ocrStatus.textContent = 'Não consegui ler essa foto agora. Preencha manualmente ou tente outra foto (nítida e sem cortar o texto).';
        }finally{
          ocrBtn.disabled = false;
        }
      });
    }
    if(overlay.querySelector('#fr-ex-back')){
      overlay.querySelector('#fr-ex-back').addEventListener('click', ()=>{ closeOverlay(); openWorkoutExerciseManager(workoutId, workoutName); });
    }
    if(overlay.querySelector('#fr-ex-delete')){
      overlay.querySelector('#fr-ex-delete').addEventListener('click', async function(){
        const btn = this; btn.disabled = true; btn.textContent = 'Excluindo...';
        const { error } = await sb.from('workout_exercises').delete().eq('id', existing.id);
        if(error){ showToast('Não foi possível excluir.', 'err'); btn.disabled=false; btn.textContent='Excluir'; return; }
        showToast('Exercício excluído.', 'ok');
        closeOverlay();
        openWorkoutExerciseManager(workoutId, workoutName);
      });
    }
    overlay.querySelector('#fr-exform').addEventListener('submit', async function(e){
      e.preventDefault();
      const btn = overlay.querySelector('button[type="submit"]');
      const name = document.getElementById('fr-ex-name').value.trim();
      if(!name){ document.getElementById('fr-ex-name').focus(); return; }
      // Quando "Personalizar cada série" está ligado, o detalhe por série manda
      // nos campos de séries/repetições/descanso — do mesmo jeito que a
      // importação de arquivo já faz (ver consolidateExercise na Edge Function).
      let sets_detail = null;
      if(detailToggle.checked){
        const rows = Array.from(detailRowsEl.querySelectorAll('.fr-exd-row')).map(row=>({
          series: row.querySelector('.fr-exd-series').value.trim() || null,
          carga: row.querySelector('.fr-exd-carga').value.trim() || null,
          tempo: row.querySelector('.fr-exd-tempo').value.trim() || null,
          rest_seconds: row.querySelector('.fr-exd-rest').value ? parseInt(row.querySelector('.fr-exd-rest').value, 10) : null,
        })).filter(r=> r.series || r.carga || r.tempo || r.rest_seconds!=null);
        if(rows.length > 0) sets_detail = rows;
      }
      let detailRestSeconds = null;
      if(sets_detail){
        for(let i=sets_detail.length-1; i>=0; i--){
          if(sets_detail[i].rest_seconds!=null){ detailRestSeconds = sets_detail[i].rest_seconds; break; }
        }
      }
      const payload = {
        name,
        sets: sets_detail ? sets_detail.length : numOrNull(document.getElementById('fr-ex-sets').value),
        reps: sets_detail ? (sets_detail.map(r=>r.series).filter(Boolean).join(' / ') || null) : (document.getElementById('fr-ex-reps').value.trim() || null),
        rest_seconds: sets_detail ? detailRestSeconds : numOrNull(document.getElementById('fr-ex-rest').value),
        video_url: document.getElementById('fr-ex-video').value.trim() || null,
        notes: document.getElementById('fr-ex-notes').value,
        sets_detail
      };
      btn.disabled = true; btn.textContent = 'Salvando...';
      try{
        if(isEdit){
          const { error } = await sb.from('workout_exercises').update(payload).eq('id', existing.id);
          if(error) throw error;
        } else {
          payload.workout_id = workoutId;
          const { count } = await sb.from('workout_exercises').select('id', {count:'exact', head:true}).eq('workout_id', workoutId);
          payload.position = (count||0) + 1;
          const { error } = await sb.from('workout_exercises').insert(payload);
          if(error) throw error;
        }
        showToast('Exercício salvo.', 'ok');
        closeOverlay();
        openWorkoutExerciseManager(workoutId, workoutName);
      }catch(err){
        console.error(err);
        showToast('Erro: ' + (err.message || JSON.stringify(err)), 'err');
        btn.disabled = false;
        btn.textContent = isEdit ? 'Salvar' : 'Adicionar';
      }
    });
  }

  /* ---------- Recipes ---------- */
  function renderTabs(){
    tabsEl.innerHTML = Object.keys(CATS).map(key =>
      `<button class="fr-tab ${key===activeCat?'active':''}" data-cat="${key}">${esc(CATS[key].label)}</button>`
    ).join('');

      btn.addEventListener('click', ()=>{
        activeCat = btn.getAttribute('data-cat');
        renderTabs();
        renderGrid();
      });

  function filteredRecipes(){
    return activeRecipeList().filter(r=>{
      const matchCat = activeCat==='todas' || r.category===activeCat;
      const matchSearch = !searchTerm || normalize(r.name).includes(normalize(searchTerm));
      return matchCat && matchSearch;
    }).sort((a,b)=> a.name.localeCompare(b.name,'pt-BR'));
  }

  function renderGrid(){
    if(!activeRecipesLoaded()){ content.innerHTML = `<div class="fr-loading">Carregando fichário...</div>`; return; }
    const list = filteredRecipes();
    const canAdd = canEditActiveScope();
    if(list.length===0){
      if(activeRecipeList().length===0){
        const emptyTitle = recipeScope==='personal' ? 'Você ainda não tem receitas particulares' : (isAdmin ? 'Seu fichário está vazio' : 'Ainda não há receitas');
        const emptyDesc = recipeScope==='personal' ? 'Cadastre aqui receitas que só você vai ver, como as que seu nutricionista passar.' : (isAdmin ? 'Cadastre as receitas das suas marmitas e refeições para buscar pelo nome sempre que precisar.' : 'Assim que forem cadastradas, as receitas aparecem aqui.');
        content.innerHTML = `
          <div class="fr-empty">
            <h3>${emptyTitle}</h3>
            <p>${emptyDesc}</p>
            ${canAdd ? '<button id="fr-empty-add">+ Cadastrar primeira receita</button>' : ''}
          </div>`;
        if(canAdd) document.getElementById('fr-empty-add').addEventListener('click', openAddModal);
      } else {
        content.innerHTML = `<div class="fr-empty"><h3>Nenhuma receita encontrada</h3><p>Tente outro termo de busca ou escolha outra categoria.</p></div>`;
      }
      return;
    }
    content.innerHTML = `<div class="fr-grid">${list.map(cardHtml).join('')}</div>`;
    list.forEach(r=>{
      const el = document.getElementById('fr-card-'+r.id);
      el.addEventListener('click', ()=> openDetail(r.id));
      el.addEventListener('keydown', e=>{ if(e.key==='Enter') openDetail(r.id); });

  function cardHtml(r){
    const cat = CATS[r.category] || CATS.todas;
    const metaParts = [];
    if(r.calories) metaParts.push(`<b>${esc(r.calories)}</b> kcal`);
    if(r.portions) metaParts.push(`<b>${esc(r.portions)}</b> porç.`);
    if(r.protein) metaParts.push(`<b>${esc(r.protein)}g</b> ptn`);
    return `
      <div class="fr-card" id="fr-card-${r.id}" tabindex="0" role="button" aria-label="Ver receita ${esc(r.name)}">
        <div class="fr-card-hole"></div>
        <div class="fr-card-tab" style="background:${cat.color}">${esc(cat.label)}</div>
        <div class="fr-card-name">${esc(r.name)}</div>
        ${metaParts.length ? `<div class="fr-card-meta">${metaParts.join(' &nbsp;·&nbsp; ')}</div>` : ''}
        ${r.notes ? `<div class="fr-card-notes">${esc(r.notes)}</div>` : ''}
      </div>`;
  }

  function linesToItems(text){ return (text||'').split('\n').map(s=>s.trim()).filter(Boolean); }

  function openDetail(id){
    const r = activeRecipeList().find(x=>x.id===id);
    if(!r) return;
    const cat = CATS[r.category] || CATS.todas;
    const hasStructured = r.ingredients_structured && r.ingredients_structured.length > 0;
    const legacyIngredients = hasStructured ? [] : linesToItems(r.ingredients);
    const canEdit = canEditActiveScope();
    const tableName = recipeScope==='shared' ? 'recipes' : 'personal_recipes';
    const overlay = buildOverlay(`
      <div class="fr-detail-tab" style="background:${cat.color}">${esc(cat.label)}</div>
      <h2 class="fr-detail-name">${esc(r.name)}</h2>
      ${recipeScope==='personal' && r.assigned_by_professional_id ? `<div class="fr-hint" style="color:var(--green-deep);font-weight:600;">Adicionada por seu profissional vinculado</div>` : ''}
      ${r.portions ? `<div class="fr-hint">Rende ${esc(r.portions)} porção(ões)</div>` : ''}
      ${(hasStructured || r.portions) ? `
      <div class="fr-field" style="margin:4px 0 2px;">
        <label for="fr-detail-portion-qty">Quantas porções você vai comer</label>
        <input type="number" min="0.25" step="0.25" id="fr-detail-portion-qty" value="1">
      </div>` : ''}
      <div class="fr-nutrition">
        <div><span class="fr-nut-val" id="fr-nut-cal">${esc(r.calories ?? '—')}</span><span class="fr-nut-label">kcal</span></div>
        <div><span class="fr-nut-val" id="fr-nut-prot">${esc(r.protein ?? '—')}</span><span class="fr-nut-label">ptn (g)</span></div>
