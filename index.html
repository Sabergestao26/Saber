  function buildOverlay(innerHtml){
    closeOverlay();
    const overlay = document.createElement('div');
    overlay.className = 'fr-overlay';
    overlay.id = 'fr-overlay';
    overlay.innerHTML = `<div class="fr-modal" role="dialog" aria-modal="true"><button class="fr-modal-close" id="fr-modal-close" aria-label="Fechar">&times;</button>${innerHtml}</div>`;
    document.body.appendChild(overlay);
    overlay.addEventListener('click', e=>{ if(e.target===overlay) closeOverlay(); });
    overlay.querySelector('#fr-modal-close').addEventListener('click', closeOverlay);
    document.addEventListener('keydown', escListener);
    return overlay;
  }
  function escListener(e){ if(e.key==='Escape') closeOverlay(); }
  let activeChatPollTimer = null;
  function closeOverlay(){
    const existing = document.getElementById('fr-overlay');
    if(existing) existing.remove();
    document.removeEventListener('keydown', escListener);
    if(activeChatPollTimer){ clearInterval(activeChatPollTimer); activeChatPollTimer = null; }
  }

  const UNIT_OPTIONS = ['g','kg','ml','l','unidade','xícara','colher de sopa','colher de chá','dente','pitada','a gosto'];

  function ingredientRowHtml(ing){
    ing = ing || {item:'', quantity:'', unit:'g'};
    return `
      <div class="fr-ing-row">
        <input type="number" step="0.01" min="0" class="fr-ing-qty" placeholder="Qtd" value="${ing.quantity ?? ''}">
        <select class="fr-ing-unit">${UNIT_OPTIONS.map(u=>`<option value="${esc(u)}" ${ing.unit===u?'selected':''}>${esc(u)}</option>`).join('')}</select>
        <input type="text" class="fr-ing-item" placeholder="Ingrediente (ex.: Cebola)" value="${esc(ing.item||'')}">
        <button type="button" class="fr-ing-remove" aria-label="Remover ingrediente">&times;</button>
      </div>`;
  }

  function wireIngredientEditor(container, initialList){
    let rows = (initialList && initialList.length) ? initialList.slice() : [{item:'',quantity:'',unit:'g'}];
    function render(){
      container.innerHTML = rows.map(ingredientRowHtml).join('');
      container.querySelectorAll('.fr-ing-remove').forEach((btn, i)=>{
        btn.addEventListener('click', ()=>{
          rows.splice(i, 1);
          if(rows.length===0) rows.push({item:'',quantity:'',unit:'g'});
          render();
        });
      });
    }
    render();
    return {
      addRow(){ rows.push({item:'',quantity:'',unit:'g'}); render(); },
      getRows(){
        const nodes = container.querySelectorAll('.fr-ing-row');
        const result = [];
        nodes.forEach(node=>{
          const item = node.querySelector('.fr-ing-item').value.trim();
          const qtyVal = node.querySelector('.fr-ing-qty').value;
          const unit = node.querySelector('.fr-ing-unit').value;
          if(item) result.push({ item, quantity: qtyVal==='' ? null : parseFloat(qtyVal), unit });
        });
        return result;
      }
    };
  }

  function ingredientsListHtml(list){
    if(!list || list.length===0) return '';
    return `<ul>${list.map(i=>{
      const qty = (i.quantity!==null && i.quantity!==undefined && i.quantity!=='') ? `${i.quantity} ${i.unit||''} ` : '';
      return `<li>${esc(qty)}${esc(i.item)}</li>`;
    }).join('')}</ul>`;
  }

        activity: document.getElementById('fr-ob-activity').value,
        goal: document.getElementById('fr-ob-goal').value
      };
      const result = calcMetabolicTargets(input);
      btn.disabled = true; btn.textContent = 'Calculando...';
      try{
        const { error: profErr } = await sb.from('profiles').update({
          sex: input.sex, age: input.age, height_cm: input.height, weight_kg: input.weight,
          activity_level: input.activity, goal: input.goal, onboarding_done: true
        }).eq('id', currentUser.id);
        if(profErr) throw profErr;
        const { error: targetErr } = await sb.from('daily_targets').upsert({
          user_id: currentUser.id, calories: result.calories, protein: result.protein,
          carbs: result.carbs, fat: result.fat, water_goal_ml: result.water
        });
        if(targetErr) throw targetErr;
        currentProfile = { ...currentProfile, ...input, height_cm: input.height, weight_kg: input.weight, activity_level: input.activity, onboarding_done: true };
        targets = result;
        showToast(`Metas calculadas: ${result.calories} kcal por dia.`, 'ok');
        closeOverlay();
        if(currentView==='diary') renderDiary();
      }catch(err){
        console.error(err);
        showToast('Não foi possível salvar agora. Tente novamente.', 'err');
        btn.disabled = false; btn.textContent = 'Calcular minhas metas';
      }
    });
  }

  function dayTotals(){

      return acc;
    }, {calories:0, protein:0, carbs:0, fat:0, fiber:0});

  let calendarYear, calendarMonth;

  async function renderWeeklyGoalsProgress(){
    const el = document.getElementById('fr-weekly-goals-section');
    if(!el) return;
    const hasAnyWeeklyGoal = targets && (targets.weekly_workout_days || targets.weekly_water_days || targets.weekly_protein_days || targets.weekly_calories_burned);
    if(!hasAnyWeeklyGoal){ el.innerHTML = ''; return; }

    const end = todayStr();
    const start = shiftDateStr(end, -6);
    const [{ data: completions }, { data: waters }, { data: logs }, { data: burns }] = await Promise.all([
      sb.from('workout_completions').select('date').eq('user_id', currentUser.id).gte('date', start).lte('date', end),
      sb.from('water_logs').select('date, amount_ml').eq('user_id', currentUser.id).gte('date', start).lte('date', end),
      sb.from('diary_logs').select('date, protein').eq('user_id', currentUser.id).gte('date', start).lte('date', end),
      sb.from('calories_burned_logs').select('amount').eq('user_id', currentUser.id).gte('date', start).lte('date', end)
    ]);

    const trainedDays = new Set((completions||[]).map(c=>c.date));
    const waterByDay = {}; (waters||[]).forEach(w=>{ waterByDay[w.date]=(waterByDay[w.date]||0)+n0(w.amount_ml); });
    const proteinByDay = {}; (logs||[]).forEach(l=>{ proteinByDay[l.date]=(proteinByDay[l.date]||0)+n0(l.protein); });
    const waterGoal = Number(targets.water_goal_ml) || 0;
    const proteinGoal = Number(targets.protein) || 0;
    const burnedTotal = (burns||[]).reduce((s,b)=> s+n0(b.amount), 0);

    let waterDaysHit = 0, proteinDaysHit = 0, trainedCount = 0;
    for(let i=0;i<7;i++){
      const d = shiftDateStr(start, i);
      if(trainedDays.has(d)) trainedCount++;
      if(waterGoal>0 && (waterByDay[d]||0)>=waterGoal) waterDaysHit++;
      if(proteinGoal>0 && (proteinByDay[d]||0)>=proteinGoal) proteinDaysHit++;
    }

    const cards = [];
    if(targets.weekly_workout_days) cards.push({ label:'Treinos', val:trainedCount, goal:targets.weekly_workout_days, color:'var(--blue)' });
    if(targets.weekly_water_days) cards.push({ label:'Dias com água OK', val:waterDaysHit, goal:targets.weekly_water_days, color:'var(--green)' });
    if(targets.weekly_protein_days) cards.push({ label:'Dias com proteína OK', val:proteinDaysHit, goal:targets.weekly_protein_days, color:'var(--mustard)' });
    if(targets.weekly_calories_burned) cards.push({ label:'Calorias gastas', val:Math.round(burnedTotal), goal:targets.weekly_calories_burned, color:'var(--rust)' });

    el.innerHTML = `
      <div class="fr-section-label" style="max-width:1080px;margin:24px auto 12px;">Progresso da semana</div>
      <div class="fr-weekly-goals-grid">
        ${cards.map(c=>`
          <div class="fr-weekly-goal-card">
            <div class="fr-weekly-goal-label">${esc(c.label)}</div>
            <div class="fr-weekly-goal-val">${esc(c.val)} <span>/ ${esc(c.goal)}</span></div>
            <div class="fr-bar-track"><div class="fr-bar-fill" style="width:${Math.min(100,(c.val/c.goal)*100)}%;background:${c.color}"></div></div>
          </div>`).join('')}
      </div>
    `;
  }

          <span><i style="background:var(--mustard)"></i> Proteína (g)</span>

  async function renderCalendarGrid(){
    const labelEl = document.getElementById('fr-cal-month-label');
    const gridEl = document.getElementById('fr-cal-grid');
    if(!labelEl || !gridEl) return;
    const monthNames = ['Janeiro','Fevereiro','Março','Abril','Maio','Junho','Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'];
    labelEl.textContent = `${monthNames[calendarMonth]} ${calendarYear}`;
    gridEl.innerHTML = `<div class="fr-loading">Carregando...</div>`;

    const startDate = `${calendarYear}-${pad(calendarMonth+1)}-01`;
    const daysInMonth = new Date(calendarYear, calendarMonth+1, 0).getDate();
    const endDate = `${calendarYear}-${pad(calendarMonth+1)}-${pad(daysInMonth)}`;

    await loadTargetsOnce();
    const [{ data: completions }, { data: waters }, { data: logs }, { data: burns }, { data: sessions }] = await Promise.all([
      sb.from('workout_completions').select('date').eq('user_id', currentUser.id).gte('date', startDate).lte('date', endDate),
      sb.from('water_logs').select('date, amount_ml').eq('user_id', currentUser.id).gte('date', startDate).lte('date', endDate),
      sb.from('diary_logs').select('date, protein, calories').eq('user_id', currentUser.id).gte('date', startDate).lte('date', endDate),
      sb.from('calories_burned_logs').select('date, amount').eq('user_id', currentUser.id).gte('date', startDate).lte('date', endDate),
      sb.from('workout_sessions').select('started_at, duration_seconds').eq('user_id', currentUser.id).not('duration_seconds', 'is', null).gte('started_at', startDate).lte('started_at', endDate+'T23:59:59')
    ]);

    const trainedDays = new Set((completions||[]).map(c=>c.date));
    const waterByDay = {};
    (waters||[]).forEach(w=>{ waterByDay[w.date] = (waterByDay[w.date]||0) + n0(w.amount_ml); });
    const proteinByDay = {}, calByDay = {};
    (logs||[]).forEach(l=>{
      proteinByDay[l.date] = (proteinByDay[l.date]||0) + n0(l.protein);
      calByDay[l.date] = (calByDay[l.date]||0) + n0(l.calories);
    });
    const burnedByDay = {};
    (burns||[]).forEach(b=>{ burnedByDay[b.date] = n0(b.amount); });
    const durationByDay = {};
    (sessions||[]).forEach(s=>{
      const d = s.started_at.slice(0,10);
      durationByDay[d] = (durationByDay[d]||0) + n0(s.duration_seconds);
    });
    function fmtDuration(seconds){
      const mins = Math.round(seconds/60);
      if(mins < 60) return `${mins}min`;
      const h = Math.floor(mins/60), m = mins%60;
      return m>0 ? `${h}h${String(m).padStart(2,'0')}` : `${h}h`;
    }

    const firstDay = new Date(calendarYear, calendarMonth, 1).getDay();
    let html = `<div class="fr-cal-weekdays">${['D','S','T','Q','Q','S','S'].map(d=>`<span>${d}</span>`).join('')}</div><div class="fr-cal-days">`;
    for(let i=0;i<firstDay;i++) html += `<div class="fr-cal-day fr-cal-day-empty"></div>`;
    for(let d=1; d<=daysInMonth; d++){
      const dateStr = `${calendarYear}-${pad(calendarMonth+1)}-${pad(d)}`;
      const isFuture = dateStr > todayStr();
      const lines = [];
      if(!isFuture){
        if(trainedDays.has(dateStr)){
          const durLabel = durationByDay[dateStr] ? fmtDuration(durationByDay[dateStr]) : 'treino';
          lines.push(`<span class="fr-cal-metric"><i style="background:var(--blue)"></i><span style="color:var(--blue)">${durLabel}</span></span>`);
        }
        if(waterByDay[dateStr]) lines.push(`<span class="fr-cal-metric"><i style="background:var(--green)"></i><span style="color:var(--green)">${(waterByDay[dateStr]/1000).toFixed(1)}L</span></span>`);
        if(proteinByDay[dateStr]) lines.push(`<span class="fr-cal-metric"><i style="background:var(--mustard)"></i><span style="color:var(--mustard)">${Math.round(proteinByDay[dateStr])}g</span></span>`);
        if(calByDay[dateStr]) lines.push(`<span class="fr-cal-metric"><i style="background:var(--rust)"></i><span style="color:var(--rust)">${Math.round(calByDay[dateStr])}kcal</span></span>`);
        if(burnedByDay[dateStr]) lines.push(`<span class="fr-cal-metric"><i style="background:var(--plum)"></i><span style="color:var(--plum)">-${Math.round(burnedByDay[dateStr])}kcal</span></span>`);
      }
      const isToday = dateStr === todayStr();
      html += `<div class="fr-cal-day ${isToday?'fr-cal-day-today':''}"><span class="fr-cal-day-num">${d}</span><div class="fr-cal-metrics">${lines.join('')}</div></div>`;
    }
    html += `</div>`;
    gridEl.innerHTML = html;
  }

  function maybeShowWeeklyReport(){
    if(!currentProfile) return;
    const reportDay = currentProfile.report_day ?? 0;
    const todayDow = new Date().getDay();

    const daysSinceLastShown = lastShown ? Math.floor((new Date(todayStr()+'T00:00:00') - new Date(lastShown+'T00:00:00')) / 86400000) : Infinity;
    if(daysSinceLastShown < 7) return;
    if(todayDow < reportDay) return;
    generateWeeklyReport();
  }

      const token = sessionData?.session?.access_token;
      if(!token) return;
      fetch(`${SUPABASE_URL}/functions/v1/notify-professional-report`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${token}` }
      }).catch(err=> console.error('Não foi possível avisar o profissional', err));
    }catch(err){
      console.error(err);
    }
  }

  async function generateWeeklyReport(){
    const end = todayStr();
    const start = shiftDateStr(end, -6);
    await loadTargetsOnce();
    const [{ data: completions }, { data: waters }, { data: logs }, { data: burns }] = await Promise.all([
      sb.from('workout_completions').select('date').eq('user_id', currentUser.id).gte('date', start).lte('date', end),
      sb.from('water_logs').select('date, amount_ml').eq('user_id', currentUser.id).gte('date', start).lte('date', end),
      sb.from('diary_logs').select('date, protein, calories').eq('user_id', currentUser.id).gte('date', start).lte('date', end),
      sb.from('calories_burned_logs').select('amount').eq('user_id', currentUser.id).gte('date', start).lte('date', end)
    ]);
    const trainedDays = new Set((completions||[]).map(c=>c.date));
    const waterByDay = {}; (waters||[]).forEach(w=>{ waterByDay[w.date]=(waterByDay[w.date]||0)+n0(w.amount_ml); });
    const proteinByDay = {}, calByDay = {};
    (logs||[]).forEach(l=>{
      proteinByDay[l.date] = (proteinByDay[l.date]||0) + n0(l.protein);
      calByDay[l.date] = (calByDay[l.date]||0) + n0(l.calories);
    });
    const burnedTotal = (burns||[]).reduce((s,b)=> s+n0(b.amount), 0);
    const waterGoal = Number(targets && targets.water_goal_ml) || 0;
    const proteinGoal = Number(targets && targets.protein) || 0;
    const calGoal = Number(targets && targets.calories) || 0;
    const burnGoal = Number(targets && targets.weekly_calories_burned) || 0;

    let trainedCount=0, waterCount=0, proteinCount=0, calCount=0;
    for(let i=0;i<7;i++){
      const d = shiftDateStr(start, i);
      if(trainedDays.has(d)) trainedCount++;
      if(waterGoal>0 && (waterByDay[d]||0)>=waterGoal) waterCount++;
      if(proteinGoal>0 && (proteinByDay[d]||0)>=proteinGoal) proteinCount++;
      if(calGoal>0 && calByDay[d]!==undefined && calByDay[d]<=calGoal) calCount++;
    }

    const tips = [];
    if(trainedCount < 3) tips.push('Você treinou menos de 3 dias essa semana. Que tal fixar dias específicos na agenda pra criar o hábito?');
    if(waterGoal>0 && waterCount < 4) tips.push('A meta de água ficou de fora na maior parte dos dias. Tente deixar uma garrafa visível como lembrete.');
    if(proteinGoal>0 && proteinCount < 4) tips.push('A meta de proteína também ficou baixa. Inclua uma fonte de proteína em cada refeição pra facilitar.');
    if(calGoal>0 && calCount < 4) tips.push('As calorias passaram do previsto na maioria dos dias. Vale revisar as porções das refeições mais calóricas.');
    if(burnGoal>0 && burnedTotal < burnGoal) tips.push('A meta de calorias gastas na semana ainda não foi atingida. Vale intensificar um pouco os treinos ou a atividade dos próximos dias.');
    if(tips.length===0) tips.push('Semana muito consistente! Continue assim.');

    showWeeklyReportModal({ trainedCount, waterCount, proteinCount, calCount, burnedTotal, burnGoal, tips, start, end });
    notifyLinkedProfessionalOfReport();

    const { error } = await sb.from('profiles').update({ last_report_shown_date: todayStr() }).eq('id', currentUser.id);
    if(!error){ currentProfile.last_report_shown_date = todayStr(); }
  }

  function showWeeklyReportModal({ trainedCount, waterCount, proteinCount, calCount, burnedTotal, burnGoal, tips, start, end }){
    const overlay = buildOverlay(`
      <h3 class="fr-form-title">Relatório da semana</h3>
      <p class="fr-hint" style="margin-bottom:16px;">${esc(formatDateLabel(start))} até ${esc(formatDateLabel(end))}</p>
      <div class="fr-report-grid">
        <div class="fr-report-stat"><span class="fr-report-num">${trainedCount}/7</span><span class="fr-report-label">dias treinados</span></div>
        <div class="fr-report-stat"><span class="fr-report-num">${waterCount}/7</span><span class="fr-report-label">meta de água</span></div>
        <div class="fr-report-stat"><span class="fr-report-num">${proteinCount}/7</span><span class="fr-report-label">meta de proteína</span></div>
        <div class="fr-report-stat"><span class="fr-report-num">${calCount}/7</span><span class="fr-report-label">dentro das calorias</span></div>
        ${burnGoal>0 ? `<div class="fr-report-stat"><span class="fr-report-num">${Math.round(burnedTotal)}</span><span class="fr-report-label">kcal gastas / ${burnGoal}</span></div>` : ''}
      </div>

      <button class="fr-btn-primary" id="fr-report-close" style="width:100%;margin-top:16px;">Fechar</button>
    `);
    overlay.querySelector('#fr-report-close').addEventListener('click', closeOverlay);
  }

  function openTargetsModal(){
    const overlay = buildOverlay(`

      <button type="button" class="fr-btn-ghost" id="fr-use-calculator" style="width:100%;margin-bottom:16px;">Calcular automaticamente a partir dos meus dados</button>

          <div class="fr-field"><label for="fr-t-cal">Kcal</label><input type="number" min="0" id="fr-t-cal" value="${esc(targets.calories ?? '')}"></div>
          <div class="fr-field"><label for="fr-t-prot">Proteína (g)</label><input type="number" min="0" id="fr-t-prot" value="${esc(targets.protein ?? '')}"></div>

        </div>
        <div class="fr-field"><label for="fr-t-fiber">Fibra (g)</label><input type="number" min="0" id="fr-t-fiber" value="${esc(targets.fiber ?? '')}"></div>
        <div class="fr-field"><label for="fr-t-water">Meta de água (ml)</label><input type="number" min="0" id="fr-t-water" value="${esc(targets.water_goal_ml ?? '')}"></div>
        <div class="fr-hint" style="margin:10px 0 8px;font-weight:600;color:var(--green-deep);">Metas semanais</div>
        <div class="fr-row">
          <div class="fr-field"><label for="fr-t-wk-workout">Dias de treino/semana</label><input type="number" min="0" max="7" id="fr-t-wk-workout" value="${esc(targets.weekly_workout_days ?? '')}"></div>
          <div class="fr-field"><label for="fr-t-wk-water">Dias batendo meta de água</label><input type="number" min="0" max="7" id="fr-t-wk-water" value="${esc(targets.weekly_water_days ?? '')}"></div>
        </div>
        <div class="fr-row">
          <div class="fr-field"><label for="fr-t-wk-protein">Dias batendo meta de proteína</label><input type="number" min="0" max="7" id="fr-t-wk-protein" value="${esc(targets.weekly_protein_days ?? '')}"></div>
          <div class="fr-field"><label for="fr-t-wk-burn">Meta de calorias gastas/semana</label><input type="number" min="0" id="fr-t-wk-burn" value="${esc(targets.weekly_calories_burned ?? '')}"></div>
        </div>
        <div class="fr-form-actions">
          <button type="button" class="fr-btn-ghost" id="fr-targets-cancel">Cancelar</button>
          <button type="submit" class="fr-btn-primary">Salvar metas</button>
        </div>
      </form>
    `);
    overlay.querySelector('#fr-targets-cancel').addEventListener('click', closeOverlay);
    overlay.querySelector('#fr-use-calculator').addEventListener('click', ()=>{
      closeOverlay();
      openOnboardingModal();
    });
    overlay.querySelector('#fr-targets-form').addEventListener('submit', async function(e){
      e.preventDefault();
      const btn = overlay.querySelector('button[type="submit"]');
      const payload = {
        user_id: currentUser.id,
        calories: numOrNull(document.getElementById('fr-t-cal').value),
        protein: numOrNull(document.getElementById('fr-t-prot').value),
        carbs: numOrNull(document.getElementById('fr-t-carb').value),
        fat: numOrNull(document.getElementById('fr-t-fat').value),
        fiber: numOrNull(document.getElementById('fr-t-fiber').value),
        water_goal_ml: numOrNull(document.getElementById('fr-t-water').value),
        weekly_workout_days: numOrNull(document.getElementById('fr-t-wk-workout').value),
        weekly_water_days: numOrNull(document.getElementById('fr-t-wk-water').value),
        weekly_protein_days: numOrNull(document.getElementById('fr-t-wk-protein').value),
        weekly_calories_burned: numOrNull(document.getElementById('fr-t-wk-burn').value)
      };
      btn.disabled = true; btn.textContent = 'Salvando...';
      const { error } = await sb.from('daily_targets').upsert(payload);
      if(error){ showToast('Não foi possível salvar agora. Tente novamente.', 'err'); btn.disabled=false; btn.textContent='Tentar salvar de novo'; return; }
      targets = payload;
      showToast('Metas atualizadas.', 'ok');
      closeOverlay();
      renderSummary();
    });
  }

  function openLogModal(){
    const hasRecipes = recipes.length > 0;
    const defaultMeal = guessMealTypeByTime();
    const sortedRecipes = recipes.slice().sort((a,b)=>a.name.localeCompare(b.name,'pt-BR'));
    const overlay = buildOverlay(`
      <h3 class="fr-form-title">Registrar alimento</h3>
      <div class="fr-log-subtabs">
        <button type="button" class="fr-log-subtab ${hasRecipes?'active':''}" id="fr-subtab-recipe" ${hasRecipes?'':'disabled'}>Da minha receita</button>
        <button type="button" class="fr-log-subtab ${hasRecipes?'':'active'}" id="fr-subtab-custom">Item avulso</button>
      </div>
      <form id="fr-log-form">
        <div class="fr-log-panel ${hasRecipes?'active':''}" id="fr-log-panel-recipe">
          ${hasRecipes ? `
          <div class="fr-field"><label for="fr-log-recipe-select">Receita</label>
            <select id="fr-log-recipe-select">${sortedRecipes.map(r=>`<option value="${r.id}">${esc(r.name)}</option>`).join('')}</select>
          </div>
          <div class="fr-field"><label for="fr-log-qty">Quantidade (em porções)</label><input type="number" min="0.25" step="0.25" id="fr-log-qty" value="1"></div>
          <div class="fr-log-preview">
            <div><span class="v" id="fr-lp-cal">0</span><span class="l">kcal</span></div>
            <div><span class="v" id="fr-lp-prot">0</span><span class="l">ptn</span></div>
            <div><span class="v" id="fr-lp-carb">0</span><span class="l">carb</span></div>
            <div><span class="v" id="fr-lp-fat">0</span><span class="l">gord</span></div>
            <div><span class="v" id="fr-lp-fiber">0</span><span class="l">fibra</span></div>
          </div>` : `<p class="fr-hint">Ainda não há receitas cadastradas.</p>`}
        </div>
        <div class="fr-log-panel ${hasRecipes?'':'active'}" id="fr-log-panel-custom">
          <div id="fr-food-search-wrap">
            <div class="fr-field">
              <label for="fr-food-search">Buscar alimento</label>
              <input type="text" id="fr-food-search" placeholder="ex.: banana, arroz, frango grelhado..." autocomplete="off">
            </div>
            <div id="fr-food-results"></div>
            <div id="fr-food-selected" style="display:none">
              <div class="fr-food-picked" id="fr-food-picked-label"></div>
              <div class="fr-field"><label for="fr-food-qty">Quantidade consumida (g)</label><input type="number" min="1" id="fr-food-qty" value="100"></div>
              <div class="fr-log-preview">
                <div><span class="v" id="fr-fp-cal">0</span><span class="l">kcal</span></div>
                <div><span class="v" id="fr-fp-prot">0</span><span class="l">ptn</span></div>
                <div><span class="v" id="fr-fp-carb">0</span><span class="l">carb</span></div>
                <div><span class="v" id="fr-fp-fat">0</span><span class="l">gord</span></div>
                <div><span class="v" id="fr-fp-fiber">0</span><span class="l">fibra</span></div>
              </div>
              <button type="button" class="fr-btn-ghost" id="fr-food-change" style="width:100%;margin-top:8px;">Trocar alimento</button>
            </div>
            <div class="fr-hint" style="margin:10px 0 4px;">Valores da tabela TACO (base oficial brasileira), por 100g.</div>
          </div>
          <button type="button" class="fr-btn-ghost" id="fr-food-manual-toggle" style="width:100%;margin-top:6px;">Não encontrei — informar valores manualmente</button>
          <div id="fr-food-manual-wrap" style="display:none">
            <div class="fr-field"><label for="fr-log-name">Nome do alimento</label><input type="text" id="fr-log-name" placeholder="ex.: Banana, iogurte, pão francês..."></div>
            <div class="fr-row4">
              <div class="fr-field"><label for="fr-log-cal">Kcal</label><input type="number" min="0" id="fr-log-cal" value=""></div>
              <div class="fr-field"><label for="fr-log-prot">Proteína (g)</label><input type="number" min="0" id="fr-log-prot" value=""></div>
              <div class="fr-field"><label for="fr-log-carb">Carbo (g)</label><input type="number" min="0" id="fr-log-carb" value=""></div>
              <div class="fr-field"><label for="fr-log-fat">Gordura (g)</label><input type="number" min="0" id="fr-log-fat" value=""></div>
            </div>
            <div class="fr-field"><label for="fr-log-fiber">Fibra (g)</label><input type="number" min="0" step="0.1" id="fr-log-fiber" value=""></div>
          </div>
        </div>
        <div class="fr-row">
          <div class="fr-field"><label for="fr-log-meal">Refeição</label>
            <select id="fr-log-meal">${Object.keys(CATS).filter(k=>k!=='todas').map(k=>`<option value="${k}" ${k===defaultMeal?'selected':''}>${esc(CATS[k].label)}</option>`).join('')}</select>
          </div>
          <div class="fr-field"><label for="fr-log-date">Data</label><input type="date" id="fr-log-date" value="${currentDate}"></div>
        </div>
        <div class="fr-form-actions">
          <button type="button" class="fr-btn-ghost" id="fr-log-cancel">Cancelar</button>
          <button type="submit" class="fr-btn-primary">Registrar</button>
        </div>
      </form>
    `);

    const panelRecipe = overlay.querySelector('#fr-log-panel-recipe');
    const panelCustom = overlay.querySelector('#fr-log-panel-custom');
    const subtabRecipe = overlay.querySelector('#fr-subtab-recipe');
    const subtabCustom = overlay.querySelector('#fr-subtab-custom');
    let activeSource = hasRecipes ? 'recipe' : 'custom';

    function setSource(src){
      activeSource = src;
      panelRecipe.classList.toggle('active', src==='recipe');
      panelCustom.classList.toggle('active', src==='custom');
      if(subtabRecipe) subtabRecipe.classList.toggle('active', src==='recipe');
      subtabCustom.classList.toggle('active', src==='custom');
    }
    if(subtabRecipe) subtabRecipe.addEventListener('click', ()=> setSource('recipe'));
    subtabCustom.addEventListener('click', ()=> setSource('custom'));

    let selectedFood = null;
    let customMode = 'search';
    const foodSearchWrap = overlay.querySelector('#fr-food-search-wrap');
    const foodManualWrap = overlay.querySelector('#fr-food-manual-wrap');
    const foodManualToggle = overlay.querySelector('#fr-food-manual-toggle');
    const foodSearchInput = overlay.querySelector('#fr-food-search');
    const foodResultsEl = overlay.querySelector('#fr-food-results');
    const foodSelectedEl = overlay.querySelector('#fr-food-selected');
    const foodPickedLabel = overlay.querySelector('#fr-food-picked-label');
    const foodQtyInput = overlay.querySelector('#fr-food-qty');

    foodManualToggle.addEventListener('click', ()=>{
      customMode = customMode === 'search' ? 'manual' : 'search';
      foodSearchWrap.style.display = customMode==='search' ? '' : 'none';
      foodManualWrap.style.display = customMode==='manual' ? '' : 'none';
      foodManualToggle.textContent = customMode==='search'
        ? 'Não encontrei — informar valores manualmente'
        : 'Voltar a buscar na base de alimentos';
    });

    function renderFoodResults(query){
      const norm = normalize(query);
      if(norm.length < 2){ foodResultsEl.innerHTML=''; return; }
      if(!foodsLoaded){ foodResultsEl.innerHTML = `<div class="fr-hint">Carregando base de alimentos...</div>`; return; }
      const matches = foods.filter(f=> normalize(f.name).includes(norm)).slice(0,8);
      if(matches.length===0){
        foodResultsEl.innerHTML = `<div class="fr-hint" style="padding:6px 2px;">Nenhum resultado. Tente outro termo ou informe manualmente.</div>`;
        return;
      }
      foodResultsEl.innerHTML = matches.map(f=>
        `<button type="button" class="fr-food-result-item" data-id="${f.id}">${esc(f.name)}<small>${Math.round(f.kcal)} kcal / 100g</small></button>`
      ).join('');
      foodResultsEl.querySelectorAll('.fr-food-result-item').forEach(btn=>{
        btn.addEventListener('click', ()=>{
          const food = foods.find(f=> String(f.id)===btn.getAttribute('data-id'));
          pickFood(food);
        });
      });
    }
    foodSearchInput.addEventListener('input', ()=> renderFoodResults(foodSearchInput.value));

    function pickFood(food){
      selectedFood = food;
      foodSearchInput.value = '';
      foodResultsEl.innerHTML = '';
      foodSelectedEl.style.display = '';
      foodPickedLabel.innerHTML = `<b>${esc(food.name)}</b><span>100g = ${Math.round(food.kcal)} kcal · P:${food.protein}g C:${food.carbs}g G:${food.fat}g${food.fiber!=null?` F:${food.fiber}g`:''}</span>`;
      updateFoodPreview();
    }
    overlay.querySelector('#fr-food-change').addEventListener('click', ()=>{
      selectedFood = null;
      foodSelectedEl.style.display = 'none';
    });
    function updateFoodPreview(){
      if(!selectedFood) return;
      const qty = parseFloat(foodQtyInput.value) || 0;
      const factor = qty/100;
      overlay.querySelector('#fr-fp-cal').textContent = Math.round(selectedFood.kcal*factor);
      overlay.querySelector('#fr-fp-prot').textContent = Math.round(selectedFood.protein*factor);
      overlay.querySelector('#fr-fp-carb').textContent = Math.round(selectedFood.carbs*factor);
      overlay.querySelector('#fr-fp-fat').textContent = Math.round(selectedFood.fat*factor);
      overlay.querySelector('#fr-fp-fiber').textContent = Math.round(n0(selectedFood.fiber)*factor);
    }
    foodQtyInput.addEventListener('input', updateFoodPreview);

    function updateRecipePreview(){
      if(!hasRecipes) return;
      const sel = document.getElementById('fr-log-recipe-select');
      const qty = parseFloat(document.getElementById('fr-log-qty').value) || 0;
      const recipe = recipes.find(r=>r.id===sel.value);
      if(!recipe) return;
      document.getElementById('fr-lp-cal').textContent = Math.round(n0(recipe.calories)*qty);
      document.getElementById('fr-lp-prot').textContent = Math.round(n0(recipe.protein)*qty);
      document.getElementById('fr-lp-carb').textContent = Math.round(n0(recipe.carbs)*qty);
      document.getElementById('fr-lp-fat').textContent = Math.round(n0(recipe.fat)*qty);
      document.getElementById('fr-lp-fiber').textContent = Math.round(n0(recipe.fiber)*qty);
      const mealSel = document.getElementById('fr-log-meal');
      if(mealSel && CATS[recipe.category]) mealSel.value = recipe.category;
    }
    if(hasRecipes){
      document.getElementById('fr-log-recipe-select').addEventListener('change', updateRecipePreview);
      document.getElementById('fr-log-qty').addEventListener('input', updateRecipePreview);
      updateRecipePreview();
    }

    overlay.querySelector('#fr-log-cancel').addEventListener('click', closeOverlay);
    overlay.querySelector('#fr-log-form').addEventListener('submit', async function(e){
      e.preventDefault();
      const btn = overlay.querySelector('button[type="submit"]');
      const mealType = document.getElementById('fr-log-meal').value;
      const date = document.getElementById('fr-log-date').value || currentDate;
      let entry;
      if(activeSource==='recipe'){
        const sel = document.getElementById('fr-log-recipe-select');
        const qty = parseFloat(document.getElementById('fr-log-qty').value) || 0;
        const recipe = recipes.find(r=>r.id===sel.value);
        if(!recipe || qty<=0){ return; }
        entry = {
          user_id: currentUser.id, date, meal_type: mealType, source:'recipe', recipe_id:recipe.id, name:recipe.name, quantity:qty,
          calories:n0(recipe.calories)*qty, protein:n0(recipe.protein)*qty, carbs:n0(recipe.carbs)*qty, fat:n0(recipe.fat)*qty, fiber:n0(recipe.fiber)*qty
        };
      } else {
        if(customMode === 'search'){
          if(!selectedFood){
            showToast('Selecione um alimento da lista, ou toque em "informar manualmente".', 'err');
            return;
          }
          const qty = parseFloat(foodQtyInput.value) || 0;
          if(qty<=0){ foodQtyInput.focus(); return; }
          const factor = qty/100;
          entry = {
            user_id: currentUser.id, date, meal_type: mealType, source:'food', name: selectedFood.name, quantity: qty,
            calories: selectedFood.kcal*factor, protein: selectedFood.protein*factor,
            carbs: selectedFood.carbs*factor, fat: selectedFood.fat*factor, fiber: n0(selectedFood.fiber)*factor
          };
        } else {
          const name = document.getElementById('fr-log-name').value.trim();
          if(!name){ document.getElementById('fr-log-name').focus(); return; }
          entry = {
            user_id: currentUser.id, date, meal_type: mealType, source:'custom', name,
            calories: numOrNull(document.getElementById('fr-log-cal').value) || 0,
            protein: numOrNull(document.getElementById('fr-log-prot').value) || 0,
            carbs: numOrNull(document.getElementById('fr-log-carb').value) || 0,
            fat: numOrNull(document.getElementById('fr-log-fat').value) || 0,
            fiber: numOrNull(document.getElementById('fr-log-fiber').value) || 0
          };
          sb.from('food_suggestions').insert({
            submitted_by: currentUser.id, name,
            kcal: entry.calories, protein: entry.protein, carbs: entry.carbs, fat: entry.fat, fiber: entry.fiber
          }).then(({error})=>{
            if(error){ console.error('Erro ao enviar sugestão de alimento', error); return; }
            notifyAdminsPendingReview('food');
          });
        }
      }
      btn.disabled = true; btn.textContent = 'Salvando...';
      const { data, error } = await sb.from('diary_logs').insert(entry).select().single();
      if(error){
        console.error(error);
        showToast('Não foi possível salvar agora. Tente novamente.', 'err');
        btn.disabled = false; btn.textContent = 'Tentar de novo';
        return;
      }
      showToast('Alimento registrado.', 'ok');
      currentDate = date;
      closeOverlay();
      renderDiary();
    });
  }

  /* ---------- Init ---------- */
  searchInput.addEventListener('input', ()=>{
    searchTerm = searchInput.value;
    clearSearchBtn.style.display = searchTerm ? 'block' : 'none';
    renderGrid();
  });
  clearSearchBtn.addEventListener('click', ()=>{
    searchInput.value=''; searchTerm=''; clearSearchBtn.style.display='none';
    renderGrid(); searchInput.focus();
  });

  if('serviceWorker' in navigator){
    window.addEventListener('load', ()=>{ navigator.serviceWorker.register('sw.js').catch(()=>{}); });
  }
})();
</script>
