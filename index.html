<!DOCTYPE html>
<html lang="pt-BR">
<head>
<script>
  (function(){
    try{
      var pref = localStorage.getItem('saber_theme') || 'auto';
      var isDark = pref === 'dark' || (pref === 'auto' && window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches);
      if(isDark) document.documentElement.setAttribute('data-theme', 'dark');
    }catch(e){}
  })();
</script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Saber</title>
<meta name="description" content="Receitas e diário alimentar">

<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="icon" type="image/png" sizes="16x16" href="favicon-16.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="theme-color" content="#2E4F37">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Saber">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">

<style>
  :root{
    --paper: #E7DFC7;
    --paper-deep: #DCD1AE;
    --card: #FFFCF3;
    --surface: #FFFEFA;
    --ink: #262B1E;
    --ink-soft: #6B6A57;
    --green: #3F6B4A;
    --green-deep: #2E4F37;
    --green-deep-hover: #264030;
    --mustard: #BF8A2E;
    --plum: #5B3A52;
    --blue: #46687A;
    --rust: #A8481F;
    --border: rgba(38,43,30,0.14);
    --shadow: 0 3px 10px rgba(38,43,30,0.10);
    --radius: 10px;
    --err-bg: #FBE7DD;
    --ok-bg: #E3EFE4;
    --note-bg: #FBF1DC;
  }
  html[data-theme="dark"]{
    --paper: #1B1E15;
    --paper-deep: #262A1E;
    --card: #23271C;
    --surface: #262B1E;
    --ink: #EDE6D3;
    --ink-soft: #A8A38C;
    --green: #6FA37D;
    --green-deep: #4A7C58;
    --green-deep-hover: #5E9169;
    --mustard: #D9A64C;
    --plum: #A784A0;
    --blue: #82A9BE;
    --rust: #DE7B4A;
    --border: rgba(237,230,211,0.16);
    --shadow: 0 3px 12px rgba(0,0,0,0.4);
    --err-bg: #3A2320;
    --ok-bg: #1E3327;
    --note-bg: #3A311A;
  }
  *{box-sizing:border-box;}
  html,body{ margin:0; padding:0; }
  body{
    font-family:'Inter',sans-serif;
    background: var(--paper);
    background-image: radial-gradient(rgba(38,43,30,0.035) 1px, transparent 1px);
    background-size: 14px 14px;
    color: var(--ink);
    min-height:100vh;
  }

  /* ---------- Auth screen ---------- */
  #auth-screen{
    min-height:100vh; display:flex; align-items:center; justify-content:center; padding:24px;
  }
  .auth-card{
    background: var(--card); border:1px solid var(--border); border-radius: 14px;
    box-shadow: var(--shadow); padding: 30px 26px; max-width: 380px; width:100%;
  }
  .auth-title{
    font-family:'Fraunces',serif; font-weight:700; font-size:26px; color:var(--green-deep);
    margin:0 0 2px; text-align:center;
  }
  .auth-sub{
    font-family:'IBM Plex Mono',monospace; font-size:11px; letter-spacing:.1em; text-transform:uppercase;
    color:var(--ink-soft); text-align:center; margin:0 0 20px;
  }
  .auth-message{
    font-size:13px; padding:9px 12px; border-radius:7px; margin-bottom:12px;
  }
  .auth-message.err{ background:var(--err-bg); color:var(--rust); border:1px solid var(--rust); }
  .auth-message.ok{ background:var(--ok-bg); color:var(--green-deep); border:1px solid var(--green-deep); }

  /* ---------- User bar ---------- */
  .fr-user-bar{
    max-width:1080px; margin:0 auto 8px; padding: 10px 18px 0;
    display:flex; align-items:center; justify-content:flex-end; gap:10px;
    font-family:'IBM Plex Mono',monospace; font-size:11.5px; color:var(--ink-soft);
  }
  .fr-user-bar b{ color:var(--ink); font-weight:600; }
  .fr-logout-btn{
    background:none; border:1px solid var(--border); border-radius:999px; padding:5px 11px;
    cursor:pointer; color:var(--ink-soft); font-family:'IBM Plex Mono',monospace; font-size:10.5px;
    text-transform:uppercase; letter-spacing:.05em;
  }
  .fr-admin-badge{
    background: var(--mustard); color:#fff; font-size:9.5px; padding:2px 7px; border-radius:999px;
    text-transform:uppercase; letter-spacing:.05em; font-weight:600;
  }
  .fr-gear-btn{
    width:26px; height:26px; border-radius:50%; border:1px solid var(--border); background:var(--paper-deep);
    color:var(--ink); cursor:pointer; font-size:13px; display:flex; align-items:center; justify-content:center;
  }
  .fr-gear-btn:hover{ background:var(--card); }
  .fr-code-box{
    background:var(--green-deep); border-radius:10px; padding:16px; text-align:center; margin-bottom:14px;
  }
  .fr-code-label{ font-family:'IBM Plex Mono',monospace; font-size:9.5px; letter-spacing:.1em; text-transform:uppercase; color:#C9D9CD; margin-bottom:6px; }
  .fr-code-val{ font-family:'Fraunces',serif; font-weight:700; font-size:26px; letter-spacing:.1em; color:#F6F1DF; }
  .fr-linked-card{
    background:var(--surface); border:1px solid var(--border); border-radius:9px; padding:12px 14px;
    display:flex; justify-content:space-between; align-items:center; margin-bottom:10px; gap:10px;
  }
  .fr-linked-name{ font-family:'Inter',sans-serif; font-weight:600; font-size:13.5px; }
  .fr-linked-role{ font-family:'IBM Plex Mono',monospace; font-size:10px; color:var(--ink-soft); }
  .fr-client-row{
    background:var(--surface); border:1px solid var(--border); border-radius:9px; padding:12px 14px; margin-bottom:8px;
    display:flex; justify-content:space-between; align-items:center; cursor:pointer;
  }
  .fr-client-row:hover{ background:var(--paper-deep); }
  .fr-client-name{ font-weight:600; font-size:13.5px; }
  .fr-client-arrow{ color:var(--ink-soft); }
  .fr-faq-item{
    background:var(--surface); border:1px solid var(--border); border-radius:9px; margin-bottom:8px; overflow:hidden;
  }
  .fr-faq-item summary{
    padding:12px 14px; cursor:pointer; font-weight:600; font-size:13.5px; list-style:none; display:flex; justify-content:space-between; align-items:center; gap:10px;
  }
  .fr-faq-item summary::-webkit-details-marker{ display:none; }
  .fr-faq-item summary::after{ content:'+'; color:var(--ink-soft); font-weight:700; flex-shrink:0; }
  .fr-faq-item[open] summary::after{ content:'–'; }
  .fr-faq-item .fr-faq-body{ padding:0 14px 14px; font-size:13px; color:var(--ink-soft); line-height:1.55; }
  .fr-faq-group-title{
    font-family:'IBM Plex Mono',monospace; font-size:10.5px; letter-spacing:.08em; text-transform:uppercase; color:var(--ink-soft);
    margin:14px 0 8px;
  }
  .fr-faq-group-title:first-child{ margin-top:0; }
  .fr-settings-navrow{
    width:100%; background:var(--surface); border:1px solid var(--border); border-radius:10px; margin-bottom:10px;
    padding:16px; cursor:pointer; display:flex; justify-content:space-between; align-items:center; gap:10px;
    text-align:left; font-family:inherit; color:inherit;
  }
  .fr-settings-navrow:hover{ background:var(--paper-deep); }
  .fr-settings-cat-label{ font-family:'Fraunces',serif; font-weight:700; font-size:16px; }
  .fr-settings-cat-sub{ display:block; font-family:'Inter',sans-serif; font-weight:400; font-size:12px; color:var(--ink-soft); margin-top:2px; }
  .fr-settings-navrow-arrow{ color:var(--ink-soft); font-size:20px; flex-shrink:0; }
  .fr-settings-menu{ margin-bottom:22px; }
  .fr-settings-back{
    background:none; border:none; color:var(--green-deep); font-family:'Inter',sans-serif; font-weight:600;
    font-size:13.5px; cursor:pointer; padding:0; margin-bottom:16px; display:inline-flex; align-items:center; gap:4px;
  }
  .fr-settings-back:hover{ text-decoration:underline; }
  .fr-settings-subtitle{ font-family:'Fraunces',serif; font-size:19px; margin:0 0 16px; }
  .fr-settings-section{ margin-bottom:22px; }
  .fr-settings-section:last-child{ margin-bottom:0; }
  .fr-settings-section h4{
    font-family:'IBM Plex Mono',monospace; font-size:10.5px; letter-spacing:.1em; text-transform:uppercase;
    color:var(--green-deep); margin:0 0 10px; border-top:1px solid var(--border); padding-top:16px;
  }
  .fr-settings-section:first-child h4{ border-top:none; padding-top:0; }
  .fr-settings-wrap{ max-width:640px; margin:0 auto; }

  .fr-suggestion{ background:var(--surface); border:1px solid var(--border); border-radius:8px; padding:12px 14px; margin-bottom:10px; }
  .fr-suggestion-head{ margin-bottom:5px; }
  .fr-suggestion-name{ font-family:'Fraunces',serif; font-weight:600; font-size:14.5px; }
  .fr-suggestion-macros{ font-family:'IBM Plex Mono',monospace; font-size:10.5px; color:var(--ink-soft); margin-bottom:10px; }
  .fr-suggestion-actions{ display:flex; gap:8px; flex-wrap:wrap; }

  .fr-ing-row{ display:grid; grid-template-columns: 62px 96px 1fr 28px; gap:6px; margin-bottom:8px; align-items:center; }
  .fr-ing-row input, .fr-ing-row select{
    padding:7px 8px; font-size:12.5px; border:1px solid var(--border); border-radius:6px; background:var(--surface);
    font-family:'Inter',sans-serif; color:var(--ink); width:100%;
  }
  .fr-ing-remove{ background:none; border:none; color:var(--ink-soft); font-size:18px; cursor:pointer; line-height:1; }
  .fr-ing-remove:hover{ color:var(--rust); }
  @media (max-width:480px){
    .fr-ing-row{ grid-template-columns: 54px 84px 1fr 24px; }
  }

  .fr-shop-row{ display:flex; justify-content:space-between; align-items:center; background:var(--card); border:1px solid var(--border); border-radius:8px; padding:10px 12px; margin-bottom:8px; box-shadow:var(--shadow); }
  .fr-shop-row-name{ font-size:13.5px; display:flex; align-items:center; gap:8px; }
  .fr-shop-row-name small{ color:var(--ink-soft); font-family:'IBM Plex Mono',monospace; font-size:10px; }
  .fr-shop-dot{ width:9px; height:9px; border-radius:50%; flex-shrink:0; }
  .fr-shop-qty-input{ width:56px; padding:6px 8px; border:1px solid var(--border); border-radius:6px; font-family:'IBM Plex Mono',monospace; text-align:center; background:var(--surface); }
  .fr-shop-list{ background:var(--card); border:1px solid var(--border); border-radius:10px; padding:14px 16px; box-shadow:var(--shadow); }
  .fr-shop-item{ display:flex; justify-content:space-between; font-size:14px; padding:6px 0; border-bottom:1px dashed var(--border); }
  .fr-shop-item:last-child{ border-bottom:none; }
  .fr-shop-item b{ font-family:'IBM Plex Mono',monospace; font-weight:600; }

  .fr-exercise{ background:var(--card); border:1px solid var(--border); border-radius:10px; padding:14px; margin-bottom:12px; box-shadow:var(--shadow); }
  .fr-exercise-head{ display:flex; align-items:center; gap:8px; margin-bottom:6px; }
  .fr-exercise-num{ width:22px; height:22px; border-radius:50%; background:var(--green-deep); color:#F6F1DF; font-family:'IBM Plex Mono',monospace; font-size:11px; display:flex; align-items:center; justify-content:center; flex-shrink:0; }
  .fr-exercise-name{ font-family:'Fraunces',serif; font-weight:600; font-size:16px; }
  .fr-exercise-meta{ font-family:'IBM Plex Mono',monospace; font-size:11.5px; color:var(--ink-soft); margin-bottom:8px; }
  .fr-exercise-actions{ display:flex; gap:8px; flex-wrap:wrap; }
  .fr-chip{ font-family:'Inter',sans-serif; font-weight:600; font-size:12px; border-radius:6px; padding:7px 11px; border:none; cursor:pointer; }
  .fr-chip-video{ background:var(--paper-deep); color:var(--ink); }
  .fr-chip-timer{ background:var(--mustard); color:#fff; }
  .fr-chip-upload{ background:none; color:var(--green-deep); border:1px solid var(--green-deep); }
  .fr-timer-box{ background:var(--surface); border:1px solid var(--border); border-radius:10px; padding:16px; text-align:center; margin-top:10px; }
  .fr-timer-num{ font-family:'Fraunces',serif; font-weight:700; font-size:32px; color:var(--green-deep); }
  .fr-timer-label{ font-family:'IBM Plex Mono',monospace; font-size:10px; letter-spacing:.1em; text-transform:uppercase; color:var(--ink-soft); }
  .fr-timer-controls{ display:flex; gap:8px; justify-content:center; margin-top:10px; }
  .fr-timer-btn{
    font-family:'Inter',sans-serif; font-weight:600; font-size:12px; background:var(--paper-deep);
    color:var(--ink); border:1px solid var(--border); border-radius:7px; padding:7px 12px; cursor:pointer;
  }
  .fr-timer-btn:hover{ background:var(--card); }

  .fr-cardio-timer-box{ background:var(--green-deep); border-radius:12px; padding:24px 16px; text-align:center; margin-bottom:14px; }
  .fr-cardio-timer-num{ font-family:'Fraunces',serif; font-weight:700; font-size:42px; color:#F6F1DF; line-height:1; }
  .fr-cardio-timer-label{ font-family:'IBM Plex Mono',monospace; font-size:11px; letter-spacing:.08em; text-transform:uppercase; color:#F6F1DF; opacity:.85; margin-top:4px; }
  .fr-cardio-kcal{ font-family:'IBM Plex Mono',monospace; font-size:15px; color:var(--mustard); margin-top:12px; }
  .fr-cardio-controls{ display:flex; gap:8px; justify-content:center; margin-top:16px; flex-wrap:wrap; }
  .fr-cardio-pick-row{
    display:flex; align-items:center; justify-content:space-between; gap:10px; padding:11px 12px;
    border:1px solid var(--border); border-radius:8px; margin-bottom:8px; cursor:pointer; background:var(--surface);
  }
  .fr-cardio-pick-row:hover{ background:var(--paper-deep); }
  .fr-cardio-pick-row .name{ font-weight:600; font-size:13.5px; }
  .fr-cardio-pick-row small{ color:var(--ink-soft); font-family:'IBM Plex Mono',monospace; font-size:10.5px; flex-shrink:0; }

  .fr-exd-row{
    display:flex; gap:6px; flex-wrap:wrap; align-items:center; padding:8px;
    border:1px solid var(--border); border-radius:8px; margin-bottom:8px; background:var(--surface);
  }
  .fr-exd-row input{
    flex:1 1 90px; min-width:0; font-family:'Inter',sans-serif; font-size:13px; padding:8px 9px;
    border:1px solid var(--border); border-radius:6px; background:var(--card); color:var(--ink);
  }
  .fr-exd-row input:focus{ outline:2px solid var(--green); outline-offset:1px; }
  .fr-exd-num{ flex:0 0 52px; font-family:'IBM Plex Mono',monospace; font-size:11px; color:var(--ink-soft); }
  .fr-exd-remove{ flex:0 0 auto; padding:5px 9px; }

  .fr-session-hist-row{
    display:flex; justify-content:space-between; align-items:center; background:var(--surface);
    border:1px solid var(--border); border-radius:7px; padding:9px 12px; margin-bottom:6px; font-size:12.5px;
  }
  .fr-session-hist-row span{ color:var(--ink-soft); font-family:'IBM Plex Mono',monospace; font-size:11px; }
  .fr-session-hist-row b{ font-family:'IBM Plex Mono',monospace; color:var(--green-deep); }

  .fr-workout-actions{ max-width:1080px; margin:0 auto 20px; display:flex; gap:10px; flex-wrap:wrap; }
  .fr-section-label{
    max-width:1080px; margin:0 auto 12px; font-family:'IBM Plex Mono',monospace; font-size:11px;
    letter-spacing:.08em; text-transform:uppercase; color:var(--green-deep); font-weight:600;
    border-top:1px solid var(--border); padding-top:16px;
  }
  .fr-workout-actions + .fr-section-label{ border-top:none; padding-top:0; }

  .fr-pick-group{ margin-bottom:16px; }
  .fr-pick-group-title{
    font-family:'IBM Plex Mono',monospace; font-size:10.5px; letter-spacing:.08em; text-transform:uppercase;
    color:var(--green-deep); font-weight:600; margin-bottom:8px; border-bottom:1px dashed var(--border); padding-bottom:4px;
  }
  .fr-pick-row{
    display:flex; align-items:center; gap:10px; padding:7px 4px; font-size:13.5px; cursor:pointer;
  }
  .fr-pick-row:hover{ background:var(--paper-deep); border-radius:6px; }
  .fr-pick-row small{ color:var(--ink-soft); font-family:'IBM Plex Mono',monospace; font-size:10.5px; margin-left:4px; }
  .fr-pick-checkbox{ width:16px; height:16px; flex-shrink:0; accent-color:var(--green-deep); }

  .fr-session-active{
    display:flex; align-items:center; justify-content:space-between; gap:12px;
    background:var(--green-deep); border-radius:10px; padding:14px 16px; margin-bottom:14px;
  }
  .fr-session-timer{ font-family:'Fraunces',serif; font-weight:700; font-size:24px; color:#F6F1DF; }
  .fr-session-active .fr-btn-primary{ background:var(--mustard); }

  .fr-exercise-done{ opacity:.75; }
  .fr-exercise-done .fr-exercise-num{ background:var(--mustard); }
  .fr-ex-check{
    display:flex; align-items:center; gap:8px; font-size:13px; font-weight:600; color:var(--green-deep);
    margin:8px 0 4px; cursor:pointer;
  }
  .fr-ex-check input{ width:17px; height:17px; accent-color:var(--green-deep); }
  .fr-chip-load{ background:none; color:var(--plum); border:1px solid var(--plum); }

  .fr-toggle-row{ display:flex; justify-content:space-between; align-items:center; gap:12px; margin-bottom:14px; }
  .fr-toggle-row-label{ font-size:13.5px; font-weight:600; }
  .fr-toggle{ position:relative; display:inline-block; width:46px; height:26px; flex-shrink:0; }
  .fr-toggle input{ position:absolute; opacity:0; width:0; height:0; }
  .fr-toggle-track{
    position:absolute; inset:0; background:var(--border); border-radius:999px; cursor:pointer;
    transition:background .15s;
  }
  .fr-toggle-thumb{
    position:absolute; top:3px; left:3px; width:20px; height:20px; border-radius:50%; background:#fff;
    box-shadow:0 1px 3px rgba(38,43,30,0.35); transition:transform .15s;
  }
  .fr-toggle input:checked ~ .fr-toggle-track{ background:var(--green-deep); }
  .fr-toggle input:checked ~ .fr-toggle-track .fr-toggle-thumb{ transform:translateX(20px); }
  .fr-toggle input:focus-visible ~ .fr-toggle-track{ outline:2px solid var(--green-deep); outline-offset:2px; }
  .fr-toggle input:disabled ~ .fr-toggle-track{ opacity:0.5; cursor:default; }

  .fr-load-box{ background:var(--surface); border:1px dashed var(--border); border-radius:8px; padding:10px; margin-top:10px; }
  .fr-load-box-detail{ border-style:solid; }
  .fr-load-set-row{ display:grid; grid-template-columns: 70px 1fr 1fr; gap:8px; align-items:center; margin-bottom:6px; }
  .fr-load-set-row-detail{
    display:flex; flex-wrap:wrap; align-items:center; gap:6px 8px;
    padding:8px 0; border-bottom:1px dashed var(--border);
  }
  .fr-load-set-row-detail:last-child{ border-bottom:none; }
  .fr-load-set-target{ flex:1 1 100%; display:flex; flex-wrap:wrap; align-items:baseline; gap:6px; }
  .fr-load-set-target-text{ font-size:12.5px; color:var(--ink-soft); }
  .fr-load-set-row-detail .fr-load-weight, .fr-load-set-row-detail .fr-load-reps{ flex:1 1 70px; min-width:0; }
  .fr-set-timer-btn{ flex:0 0 auto; padding:5px 10px; font-size:11.5px; }
  .fr-load-set-num{ font-family:'IBM Plex Mono',monospace; font-size:11px; color:var(--ink-soft); }
  .fr-load-weight, .fr-load-reps{
    padding:6px 8px; border:1px solid var(--border); border-radius:6px; font-family:'IBM Plex Mono',monospace; font-size:12.5px;
  }
  .fr-load-history-day{
    font-size:12px; color:var(--ink-soft); margin-top:8px; padding-top:8px; border-top:1px dashed var(--border);
  }
  .fr-load-history-day b{ display:block; color:var(--ink); font-family:'IBM Plex Mono',monospace; font-size:11px; margin-bottom:3px; }
  .fr-load-history-day span{ display:block; }

  .fr-evo-title{ font-family:'IBM Plex Mono',monospace; font-size:10px; letter-spacing:.08em; text-transform:uppercase; color:var(--green-deep); font-weight:600; margin-bottom:8px; }
  .fr-evo-chart{ display:flex; flex-direction:column; gap:7px; }
  .fr-evo-row{ display:grid; grid-template-columns: 64px 1fr 44px auto; gap:8px; align-items:center; }
  .fr-evo-date{ font-family:'IBM Plex Mono',monospace; font-size:10px; color:var(--ink-soft); }
  .fr-evo-bar-track{ background:var(--paper-deep); border-radius:999px; height:8px; overflow:hidden; }
  .fr-evo-bar-fill{ height:100%; background:var(--plum); border-radius:999px; }
  .fr-evo-weight{ font-family:'IBM Plex Mono',monospace; font-size:11px; font-weight:600; text-align:right; }
  .fr-evo-trend{ font-family:'IBM Plex Mono',monospace; font-size:10px; white-space:nowrap; }
  .fr-evo-up{ color:var(--green-deep); }
  .fr-evo-down{ color:var(--rust); }
  .fr-evo-same{ color:var(--ink-soft); }

  #ficharo-root{ padding: 4px 18px 60px; }
  #ficharo-root *{ box-sizing:border-box; }

  .fr-header{
    max-width: 1080px; margin: 0 auto 16px; display:flex; align-items:flex-end;
    justify-content:space-between; gap:16px; flex-wrap:wrap;
  }
  .fr-title{

  function urlBase64ToUint8Array(base64String){
    const padding = '='.repeat((4 - base64String.length % 4) % 4);
    const base64 = (base64String + padding).replace(/-/g, '+').replace(/_/g, '/');
    const rawData = atob(base64);
    const outputArray = new Uint8Array(rawData.length);
    for(let i=0; i<rawData.length; ++i) outputArray[i] = rawData.charCodeAt(i);
    return outputArray;
  }

  async function subscribeToPush(){
    if(!('serviceWorker' in navigator) || !('PushManager' in window)){
      showToast('Esse navegador não suporta notificações push.', 'err');
      return false;
    }
    try{
      const permission = await Notification.requestPermission();
      if(permission !== 'granted'){
        showToast('Permissão não concedida.', 'err');
        return false;
      }
      const reg = await navigator.serviceWorker.ready;
      let sub = await reg.pushManager.getSubscription();
      if(!sub){
        sub = await reg.pushManager.subscribe({
          userVisibleOnly: true,
          applicationServerKey: urlBase64ToUint8Array(VAPID_PUBLIC_KEY)
        });
      }
      const subJson = sub.toJSON();
      const { error } = await sb.from('push_subscriptions').upsert({
        user_id: currentUser.id,
        endpoint: subJson.endpoint,
        p256dh: subJson.keys.p256dh,
        auth: subJson.keys.auth
      }, { onConflict: 'user_id,endpoint' });
      if(error){ showToast('Não foi possível salvar a inscrição.', 'err'); return false; }
      showToast('Notificações push ativadas!', 'ok');
      return true;
    }catch(err){
      console.error('Erro ao ativar notificações push', err);
      showToast('Não foi possível ativar as notificações push.', 'err');
      return false;
    }
  }

  async function unsubscribeFromPush(){
    try{
      if(!('serviceWorker' in navigator)) return true;
      const reg = await navigator.serviceWorker.getRegistration();
      if(reg){
        const sub = await reg.pushManager.getSubscription();
        if(sub){
          await sb.from('push_subscriptions').delete().eq('user_id', currentUser.id).eq('endpoint', sub.endpoint);
          await sub.unsubscribe();
        }
      }
      showToast('Notificações push desativadas.', 'ok');
      return true;
    }catch(err){

    }
  }

  function showAuthMessage(text, type){
    authMessage.textContent = text;
    authMessage.className = 'auth-message ' + (type==='ok' ? 'ok' : 'err');
    authMessage.hidden = false;
  }

  document.getElementById('auth-forgot-link').addEventListener('click', async function(){
    const email = document.getElementById('auth-email').value.trim();
    if(!email){
      showAuthMessage('Digite seu e-mail no campo acima primeiro, depois toque em "Esqueci minha senha".', 'err');
      document.getElementById('auth-email').focus();
      return;
    }
    this.disabled = true;
    const { error } = await sb.auth.resetPasswordForEmail(email, { redirectTo: window.location.href.split('#')[0] });
    this.disabled = false;
    if(error){ showAuthMessage(error.message, 'err'); return; }
    showAuthMessage('Enviamos um link pro seu e-mail. Abra ele nesse mesmo aparelho pra criar uma nova senha.', 'ok');
  });

  authForm.addEventListener('submit', async function(e){
    e.preventDefault();
    const email = document.getElementById('auth-email').value.trim();
    const password = document.getElementById('auth-password').value;
    if(authMode==='signup' && !document.getElementById('auth-terms-checkbox').checked){
      showAuthMessage('Pra criar sua conta, você precisa marcar que leu e concorda com os Termos de Uso e a Política de Privacidade.', 'err');
      return;
    }
    if(authMode==='signup' && document.getElementById('auth-role').value !== 'cliente' && !document.getElementById('auth-prof-terms-checkbox').checked){
      showAuthMessage('Pra se cadastrar como profissional, você também precisa marcar que concorda com os Termos de Uso para Profissionais.', 'err');
      return;
    }
    authSubmit.disabled = true;
    authSubmit.textContent = authMode==='login' ? 'Entrando...' : 'Criando conta...';
    try{
      if(authMode==='login'){
        const { error } = await sb.auth.signInWithPassword({ email, password });
        if(error){
          showAuthMessage(error.message==='Invalid login credentials' ? 'E-mail ou senha incorretos.' : error.message, 'err');
        }
      } else {
        const role = document.getElementById('auth-role').value;
        const { data, error } = await sb.auth.signUp({ email, password });
        if(error){
          showAuthMessage(error.message, 'err');
        } else {
          if(role !== 'cliente'){
            // guarda a escolha pra aplicar assim que o perfil existir (agora ou no 1º login)
            localStorage.setItem('saber_pending_role_' + email.toLowerCase(), role);
            // guarda também o aceite dos Termos para Profissionais, no mesmo padrão
            localStorage.setItem('saber_pending_prof_terms_' + email.toLowerCase(), PROF_TERMS_VERSION);
          }
          // guarda o aceite dos Termos/Política pra registrar no perfil assim
          // que ele existir (agora, se não precisar confirmar e-mail, ou no
          // 1º login, se precisar) — mesmo padrão do cargo acima.
          localStorage.setItem('saber_pending_terms_' + email.toLowerCase(), TERMS_VERSION);
        }
        if(!error && !data.session){
          setAuthMode('login');
          showAuthMessage('Conta criada! Verifique seu e-mail para confirmar antes de entrar.', 'ok');
        }
      }
    }catch(err){
      showAuthMessage('Não foi possível conectar agora. Tente novamente.', 'err');
    }
    authSubmit.disabled = false;
    authSubmit.textContent = authMode==='login' ? 'Entrar' : 'Criar conta';
  });

  async function loadProfessionalLinkStatus(){
    const { data: linkRow } = await sb.from('professional_clients').select('*').eq('client_id', currentUser.id).maybeSingle();
    if(linkRow){
      const { data: profRow } = await sb.from('profiles').select('*').eq('id', linkRow.professional_id).maybeSingle();
      linkedProfessional = profRow ? { ...profRow, linkId: linkRow.id } : { linkId: linkRow.id };
    } else {
      linkedProfessional = null;
    }
  }

  async function loadMyClients(){
    if(!currentProfile || !currentProfile.is_professional){ myClients = []; return; }
    const { data: links } = await sb.from('professional_clients').select('*').eq('professional_id', currentUser.id);
    if(!links || links.length===0){ myClients = []; return; }
    const clientIds = links.map(l=>l.client_id);
    const { data: profs } = await sb.from('profiles').select('*').in('id', clientIds);
    myClients = links.map(l=>{
      const p = (profs||[]).find(pp=>pp.id===l.client_id);
      return { linkId: l.id, client_id: l.client_id, email: p ? p.email : '(sem nome)' };
    }).sort((a,b)=> a.email.localeCompare(b.email,'pt-BR'));
  }

  const PROF_VERIF_MAX_MB = 8;

  async function renderProfVerifArea(overlay){
    const el = overlay.querySelector('#fr-prof-verif-area');
    const { data: verif, error } = await sb.from('professional_verifications').select('*').eq('user_id', currentUser.id).maybeSingle();
    if(error){ el.innerHTML = `<p class="fr-hint">Não foi possível carregar.</p>`; return; }

    const status = verif ? verif.status : 'none';

    function uploadFormHtml(intro){
      return `
        <p class="fr-hint" style="margin-bottom:10px;">${intro}</p>
        <div class="fr-field"><label for="fr-verif-reg">Número de registro (CRN ou CREF)</label><input type="text" id="fr-verif-reg" placeholder="Ex.: CRN-1 12345" value="${esc((verif && verif.registration_number) || '')}"></div>
        <div class="fr-field"><label for="fr-verif-file">Foto do documento (carteira ou comprovante do conselho)</label><input type="file" id="fr-verif-file" accept="image/*" capture="environment"></div>
        <p class="fr-hint" style="margin-bottom:10px;">Tire uma foto nítida, com todos os dados legíveis: nome, número de registro e situação. Arquivo até ${PROF_VERIF_MAX_MB}MB.</p>
        <button class="fr-btn-primary" id="fr-verif-submit" style="width:100%;">Enviar pra revisão</button>
        <div id="fr-verif-msg"></div>`;
    }

    if(status === 'approved'){
      el.innerHTML = `<p class="fr-hint" style="color:var(--green-deep);">✅ Documento aprovado. Você já pode vincular clientes e passar treino ou dieta pra eles.</p>`;
      return;
    }
    if(status === 'pending'){
      el.innerHTML = `<p class="fr-hint">📄 Documento enviado, em revisão. Assim que for analisado, você recebe um aviso aqui. Enquanto isso, vincular clientes e atribuir treino/dieta fica bloqueado.</p>`;
      return;
    }
    if(status === 'rejected'){
      el.innerHTML = `
        <p class="fr-hint" style="color:var(--rust);margin-bottom:10px;">Seu documento não foi aprovado${verif && verif.rejection_reason ? ': ' + esc(verif.rejection_reason) : '.'} Envie novamente, com uma foto mais nítida ou o documento correto.</p>
        ${uploadFormHtml('Reenvie o documento pra revisão.')}`;
    } else {
      el.innerHTML = uploadFormHtml('Antes de vincular clientes ou passar treino/dieta pra alguém, envie a foto do seu documento de registro profissional pra revisão.');
    }

    const submitBtn = el.querySelector('#fr-verif-submit');
    submitBtn.addEventListener('click', async function(){
      const msgEl = el.querySelector('#fr-verif-msg');
      const regInput = el.querySelector('#fr-verif-reg');
      const fileInput = el.querySelector('#fr-verif-file');
      const registrationNumber = regInput.value.trim();
      const file = fileInput.files[0];
      msgEl.innerHTML = '';
      if(!registrationNumber){
        msgEl.innerHTML = `<p class="fr-hint" style="color:var(--rust);margin-top:6px;">Digite o número de registro.</p>`;
        regInput.focus();
        return;
      }
      if(!file){
        msgEl.innerHTML = `<p class="fr-hint" style="color:var(--rust);margin-top:6px;">Selecione a foto do documento.</p>`;
        return;
      }
      if(file.size > PROF_VERIF_MAX_MB * 1024 * 1024){
        msgEl.innerHTML = `<p class="fr-hint" style="color:var(--rust);margin-top:6px;">Esse arquivo passa de ${PROF_VERIF_MAX_MB}MB. Envie uma foto menor.</p>`;
        return;
      }
      submitBtn.disabled = true; submitBtn.textContent = 'Enviando...';
      try{
        const ext = (file.name.split('.').pop() || 'jpg').toLowerCase().replace(/[^a-z0-9]/g, '') || 'jpg';
        const path = `${currentUser.id}/documento.${ext}`;
        const { error: upErr } = await sb.storage.from('professional-docs').upload(path, file, { upsert: true, contentType: file.type || undefined });
        if(upErr) throw upErr;

        const nowIso = new Date().toISOString();
        if(!verif){
          const { error: insErr } = await sb.from('professional_verifications').insert({
            user_id: currentUser.id, status: 'pending', registration_number: registrationNumber,
            doc_path: path, submitted_at: nowIso, updated_at: nowIso
          });
          if(insErr) throw insErr;
        } else {
          const { error: updErr } = await sb.from('professional_verifications').update({
            status: 'pending', registration_number: registrationNumber, doc_path: path,
            submitted_at: nowIso, updated_at: nowIso, reviewed_at: null, rejection_reason: null
          }).eq('user_id', currentUser.id);
          if(updErr) throw updErr;
        }
        showToast('Documento enviado pra revisão.', 'ok');
        renderProfVerifArea(overlay);
      }catch(err){
        console.error(err);
        msgEl.innerHTML = `<p class="fr-hint" style="color:var(--rust);margin-top:6px;">Não foi possível enviar agora. Tente novamente.</p>`;
        submitBtn.disabled = false; submitBtn.textContent = 'Enviar pra revisão';
      }
    });
  }

  async function openChatModal(professionalId, clientId, otherLabel){
    const overlay = buildOverlay(`
      <h3 class="fr-form-title">💬 ${esc(otherLabel)}</h3>
      <div id="fr-chat-messages" style="max-height:50vh;overflow-y:auto;display:flex;flex-direction:column;gap:8px;padding:4px;border:1px solid var(--border);border-radius:10px;margin-bottom:10px;"><div class="fr-loading">Carregando...</div></div>
      <form id="fr-chat-form" style="display:flex;gap:8px;">
        <input type="text" id="fr-chat-input" placeholder="Escreva uma mensagem..." style="flex:1;" autocomplete="off" maxlength="2000">
        <button type="submit" class="fr-btn-primary" style="width:auto;padding:0 18px;">Enviar</button>
      </form>
      <div id="fr-chat-msg"></div>
    `);
    const msgsEl = overlay.querySelector('#fr-chat-messages');

    async function loadMessages(){
      const { data, error } = await sb.from('professional_messages').select('*')
        .eq('professional_id', professionalId).eq('client_id', clientId)
        .order('created_at', { ascending: true }).limit(300);
      if(!document.getElementById('fr-chat-messages')) return; // modal já foi fechado
      if(error){ msgsEl.innerHTML = `<p class="fr-hint">Não foi possível carregar as mensagens.</p>`; return; }
      const wasNearBottom = (msgsEl.scrollTop + msgsEl.clientHeight) >= (msgsEl.scrollHeight - 40);
      const list = data || [];
      msgsEl.innerHTML = list.length ? list.map(m=>{
        const mine = m.sender_id === currentUser.id;
        const when = new Date(m.created_at).toLocaleString('pt-BR', {day:'2-digit', month:'2-digit', hour:'2-digit', minute:'2-digit'});
        return `<div style="align-self:${mine?'flex-end':'flex-start'};max-width:78%;background:${mine?'var(--green-deep)':'var(--card)'};color:${mine?'#fff':'var(--ink)'};border:${mine?'none':'1px solid var(--border)'};padding:8px 12px;border-radius:12px;font-size:14px;white-space:pre-wrap;word-break:break-word;">${esc(m.body)}<div style="font-size:10.5px;opacity:0.75;margin-top:3px;">${when}</div></div>`;
      }).join('') : `<p class="fr-hint">Nenhuma mensagem ainda. Diga oi!</p>`;
      if(wasNearBottom) msgsEl.scrollTop = msgsEl.scrollHeight;
    }

    await loadMessages();
    msgsEl.scrollTop = msgsEl.scrollHeight;
    activeChatPollTimer = setInterval(loadMessages, 4000);

    overlay.querySelector('#fr-chat-form').addEventListener('submit', async function(e){
      e.preventDefault();
      const input = overlay.querySelector('#fr-chat-input');
      const body = input.value.trim();
      if(!body) return;
      const msgArea = overlay.querySelector('#fr-chat-msg');
      input.disabled = true;
      const { error } = await sb.from('professional_messages').insert({
        professional_id: professionalId, client_id: clientId, sender_id: currentUser.id, body
      });
      input.disabled = false;
      if(error){
        msgArea.innerHTML = `<p class="fr-hint" style="color:var(--rust);margin-top:6px;">Não foi possível enviar. Tente novamente.</p>`;
        return;
      }
      input.value = '';
      msgArea.innerHTML = '';
      await loadMessages();
      input.focus();
      notifyChatMessage(professionalId, clientId, body);
    });
  }

          s.textContent = (parseInt(s.getAttribute('data-star'),10) <= selectedRating) ? '★' : '☆';
        });

            const { error } = await sb.from('professional_feedback').update({ rating: selectedRating, message: message || null }).eq('id', existing.id);

          } else {
            const { error } = await sb.from('professional_feedback').insert({ professional_id: professionalId, client_id: currentUser.id, kind: 'avaliacao', rating: selectedRating, message: message || null });

          const { error } = await sb.from('professional_feedback').insert({ professional_id: professionalId, client_id: currentUser.id, kind: 'reclamacao', message });

        }
        showToast(isRate ? 'Avaliação salva. Obrigado!' : 'Reclamação enviada. Nossa equipe vai revisar.', 'ok');

      }catch(err){
        console.error(err);
        resultEl.innerHTML = `<p class="fr-hint" style="color:var(--rust);margin-top:6px;">Não foi possível enviar agora. Tente novamente.</p>`;
        btn.disabled = false; btn.textContent = isRate ? 'Salvar avaliação' : 'Enviar reclamação';

  async function viewClientWeeklyReport(client){
    const overlay = buildOverlay(`
      <h3 class="fr-form-title">Relatório semanal — ${esc(client.email)}</h3>
      <div id="fr-client-report-content"><div class="fr-loading">Carregando...</div></div>
    `);
    const contentEl = overlay.querySelector('#fr-client-report-content');

    const end = todayStr();
    const start = shiftDateStr(end, -6);
    const [{ data: targetsRow }, { data: completions }, { data: waters }, { data: logs }, { data: burns }] = await Promise.all([
      sb.from('daily_targets').select('*').eq('user_id', client.client_id).maybeSingle(),
      sb.from('workout_completions').select('date').eq('user_id', client.client_id).gte('date', start).lte('date', end),
      sb.from('water_logs').select('date, amount_ml').eq('user_id', client.client_id).gte('date', start).lte('date', end),
      sb.from('diary_logs').select('date, protein, calories').eq('user_id', client.client_id).gte('date', start).lte('date', end),
      sb.from('calories_burned_logs').select('amount').eq('user_id', client.client_id).gte('date', start).lte('date', end)
    ]);

    if(!targetsRow){
      contentEl.innerHTML = `<p class="fr-hint">Esse cliente ainda não definiu metas diárias, então não dá pra calcular o relatório.</p>`;
      return;
    }

    const trainedDays = new Set((completions||[]).map(c=>c.date));
    const waterByDay = {}; (waters||[]).forEach(w=>{ waterByDay[w.date]=(waterByDay[w.date]||0)+n0(w.amount_ml); });
    const proteinByDay = {}, calByDay = {};
    (logs||[]).forEach(l=>{
      proteinByDay[l.date] = (proteinByDay[l.date]||0) + n0(l.protein);
      calByDay[l.date] = (calByDay[l.date]||0) + n0(l.calories);
    });
    const burnedTotal = (burns||[]).reduce((s,b)=> s+n0(b.amount), 0);
    const waterGoal = Number(targetsRow.water_goal_ml) || 0;
    const proteinGoal = Number(targetsRow.protein) || 0;
    const calGoal = Number(targetsRow.calories) || 0;
    const burnGoal = Number(targetsRow.weekly_calories_burned) || 0;

    let trainedCount=0, waterCount=0, proteinCount=0, calCount=0;
    for(let i=0;i<7;i++){
      const d = shiftDateStr(start, i);
      if(trainedDays.has(d)) trainedCount++;
      if(waterGoal>0 && (waterByDay[d]||0)>=waterGoal) waterCount++;
      if(proteinGoal>0 && (proteinByDay[d]||0)>=proteinGoal) proteinCount++;
      if(calGoal>0 && calByDay[d]!==undefined && calByDay[d]<=calGoal) calCount++;
    }

    contentEl.innerHTML = `
      <p class="fr-hint" style="margin-bottom:14px;">${esc(formatDateLabel(start))} até ${esc(formatDateLabel(end))}</p>
      <div class="fr-report-grid">
        <div class="fr-report-stat"><span class="fr-report-num">${trainedCount}/7</span><span class="fr-report-label">dias treinados</span></div>
        <div class="fr-report-stat"><span class="fr-report-num">${waterCount}/7</span><span class="fr-report-label">meta de água</span></div>
        <div class="fr-report-stat"><span class="fr-report-num">${proteinCount}/7</span><span class="fr-report-label">meta de proteína</span></div>
        <div class="fr-report-stat"><span class="fr-report-num">${calCount}/7</span><span class="fr-report-label">dentro das calorias</span></div>
        ${burnGoal>0 ? `<div class="fr-report-stat"><span class="fr-report-num">${Math.round(burnedTotal)}</span><span class="fr-report-label">kcal gastas / ${burnGoal}</span></div>` : ''}
      </div>
    `;
  }

  async function startSubscriptionCheckout(container, planKey, btn){
    const msgEl = container.querySelector('#fr-sub-msg');
    const originalLabel = btn.innerHTML;
    container.querySelectorAll('.fr-sub-plan-btn').forEach(b=>{ b.disabled = true; });
    btn.innerHTML = 'Preparando pagamento...';
    msgEl.innerHTML = '';
    try{
      const { data: sessionData } = await sb.auth.getSession();
      const token = sessionData?.session?.access_token;
      const returnUrlBase = window.location.origin + window.location.pathname;
      const res = await fetch(`${SUPABASE_URL}/functions/v1/mp-create-preference`, {
        method: 'POST',
        headers: { 'Authorization': `Bearer ${token}`, 'Content-Type': 'application/json' },
        body: JSON.stringify({ plan: planKey, return_url_base: returnUrlBase })
      });
      const result = await res.json();
      if(!res.ok || result.error || !result.init_point){
        // O motivo real (erro devolvido pelo Mercado Pago, por exemplo)
        // não aparece pra quem está assinando — só aqui no console, pra
        // quem estiver com as ferramentas de desenvolvedor abertas
        // testando o fluxo de pagamento.
        console.error('Não foi possível criar o pagamento:', result);
        msgEl.innerHTML = `<p class="fr-hint" style="color:var(--rust);margin-top:6px;">Não foi possível iniciar o pagamento agora. Tente novamente em instantes.</p>`;
        container.querySelectorAll('.fr-sub-plan-btn').forEach(b=>{ b.disabled = false; });
        btn.innerHTML = originalLabel;
        return;
      }
      window.location.href = result.init_point;
    }catch(err){
      console.error(err);
      msgEl.innerHTML = `<p class="fr-hint" style="color:var(--rust);margin-top:6px;">Não foi possível iniciar o pagamento agora.</p>`;
      container.querySelectorAll('.fr-sub-plan-btn').forEach(b=>{ b.disabled = false; });
      btn.innerHTML = originalLabel;
    }
  }

  async function ensureProfile(){
    let { data } = await sb.from('profiles').select('*').eq('id', currentUser.id).maybeSingle();
    if(!data){
      const { data: inserted } = await sb.from('profiles').insert({ id: currentUser.id, email: currentUser.email }).select().single();
      data = inserted;
    }
    currentProfile = data;
    isAdmin = !!(data && data.is_admin);

    const pendingKey = 'saber_pending_role_' + currentUser.email.toLowerCase();
    const pendingRole = localStorage.getItem(pendingKey);
    if(pendingRole && !currentProfile.is_professional){
      const label = pendingRole === 'nutricionista' ? 'Nutricionista' : (pendingRole === 'personal' ? 'Personal trainer' : null);
      if(label){
        const { data: updated, error } = await sb.from('profiles')
          .update({ is_professional: true, professional_label: label })
          .eq('id', currentUser.id).select().single();
        if(!error && updated){ currentProfile = updated; }
      }
      localStorage.removeItem(pendingKey);
    }

    const pendingTermsKey = 'saber_pending_terms_' + currentUser.email.toLowerCase();
    const pendingTermsVersion = localStorage.getItem(pendingTermsKey);
    if(pendingTermsVersion && !currentProfile.terms_accepted_at){
      const { data: updatedTerms, error: termsErr } = await sb.from('profiles')
        .update({ terms_accepted_at: new Date().toISOString(), terms_version: pendingTermsVersion })
        .eq('id', currentUser.id).select().single();
      if(!termsErr && updatedTerms){ currentProfile = updatedTerms; }
    }
    if(pendingTermsVersion) localStorage.removeItem(pendingTermsKey);

    const pendingProfTermsKey = 'saber_pending_prof_terms_' + currentUser.email.toLowerCase();
    const pendingProfTermsVersion = localStorage.getItem(pendingProfTermsKey);
    if(pendingProfTermsVersion && !currentProfile.prof_terms_accepted_at){
      const { data: updatedProfTerms, error: profTermsErr } = await sb.from('profiles')
        .update({ prof_terms_accepted_at: new Date().toISOString(), prof_terms_version: pendingProfTermsVersion })
        .eq('id', currentUser.id).select().single();
      if(!profTermsErr && updatedProfTerms){ currentProfile = updatedProfTerms; }
    }
    if(pendingProfTermsVersion) localStorage.removeItem(pendingProfTermsKey);
  }

  function handleSubscriptionReturn(){

  /* ---------- Lista de Compras ---------- */
  let shoppingSearchTerm = '';
  let shoppingQuantities = {};

  function combinedRecipesForShopping(){
    const shared = recipes.map(r=>({...r, _src:'shared'}));
    const personal = personalRecipes.map(r=>({...r, _src:'personal'}));
    return shared.concat(personal).sort((a,b)=>a.name.localeCompare(b.name,'pt-BR'));
  }

  function formatQty(n){
    const rounded = Math.round(n*100)/100;
    if(rounded % 1 === 0) return String(rounded);
    return rounded.toFixed(2).replace(/0+$/,'').replace(/\.$/,'');
  }

  function renderShoppingView(){
    const el = document.getElementById('fr-shopping-content');
    if(!recipesLoaded || !personalRecipesLoaded){ el.innerHTML = `<div class="fr-loading">Carregando receitas...</div>`; return; }
    const list = combinedRecipesForShopping();
    if(list.length===0){
      el.innerHTML = `<div class="fr-empty"><h3>Nenhuma receita cadastrada ainda</h3><p>Cadastre receitas no Fichário pra poder gerar sua lista de compras.</p></div>`;
      return;
    }
    el.innerHTML = `
      <div class="fr-toolbar">
        <div class="fr-search-wrap">
          <svg width="15" height="15" viewBox="0 0 15 15" fill="none"><circle cx="6.5" cy="6.5" r="5" stroke="#262B1E" stroke-width="1.4"/><path d="M10.2 10.2L13.5 13.5" stroke="#262B1E" stroke-width="1.4" stroke-linecap="round"/></svg>
          <input id="fr-shop-search" type="text" placeholder="buscar receita..." autocomplete="off">
        </div>
      </div>
      <div class="fr-hint" style="margin-bottom:12px;">Informe quantas marmitas/porções você quer fazer de cada receita.</div>
      <div id="fr-shop-recipe-list"></div>
      <button class="fr-btn-primary" id="fr-shop-generate" style="width:100%;margin-top:16px;">Gerar lista de compras</button>
      <div id="fr-shop-result" style="margin-top:20px;"></div>
    `;
    function renderRows(){
      const norm = normalize(shoppingSearchTerm);
      const filtered = list.filter(r=> !norm || normalize(r.name).includes(norm));
      const rowsEl = document.getElementById('fr-shop-recipe-list');
      if(filtered.length===0){ rowsEl.innerHTML = `<p class="fr-hint">Nenhuma receita encontrada.</p>`; return; }
      rowsEl.innerHTML = filtered.map(r=>{
        const cat = CATS[r.category] || CATS.todas;
        const qty = shoppingQuantities[r.id] || '';
        return `
          <div class="fr-shop-row">
            <div class="fr-shop-row-name"><span class="fr-shop-dot" style="background:${cat.color}"></span>${esc(r.name)} ${r._src==='personal' ? '<small>(particular)</small>' : ''}</div>
            <input type="number" min="0" step="1" class="fr-shop-qty-input" data-id="${r.id}" placeholder="0" value="${esc(qty)}">
          </div>`;
      }).join('');
      rowsEl.querySelectorAll('.fr-shop-qty-input').forEach(inp=>{
        inp.addEventListener('input', ()=>{
          const id = inp.getAttribute('data-id');
          const v = parseFloat(inp.value);
          if(!v || v<=0){ delete shoppingQuantities[id]; } else { shoppingQuantities[id] = v; }
        });
      });
    }
    renderRows();
    document.getElementById('fr-shop-search').addEventListener('input', function(){
      shoppingSearchTerm = this.value;
      renderRows();
    });
    document.getElementById('fr-shop-generate').addEventListener('click', ()=> generateShoppingList(list));
  }

  /* ---------- Leitura (livros, sessões de leitura, metas) ---------- */
  async function loadBooks(){
    if(booksLoaded) return;
    const { data, error } = await sb.from('books').select('*').eq('user_id', currentUser.id).order('created_at', { ascending:false });
    if(error){ console.error('Erro ao carregar livros', error); books = []; booksLoaded = true; return; }
    books = data || [];
    booksLoaded = true;
  }

  async function loadReadingTargetsOnce(){
    if(readingTargetsLoaded) return;
    const { data } = await sb.from('reading_targets').select('*').eq('user_id', currentUser.id).maybeSingle();
    readingTargets = data || {};
    readingTargetsLoaded = true;
  }

  async function loadReadingStats(){
    const today = todayStr();
    const weekStart = shiftDateStr(today, -6);
    const monthStart = today.slice(0,8) + '01';
    const [{ data: todaySessions }, { data: weekSessions }, { data: finished }] = await Promise.all([
      sb.from('reading_sessions').select('minutes').eq('user_id', currentUser.id).eq('date', today),
      sb.from('reading_sessions').select('minutes').eq('user_id', currentUser.id).gte('date', weekStart).lte('date', today),
      sb.from('books').select('id').eq('user_id', currentUser.id).eq('status','concluido').gte('finished_at', monthStart).lte('finished_at', today)
    ]);
    readingStats = {
      todayMinutes: (todaySessions||[]).reduce((s,x)=> s+n0(x.minutes), 0),
      weekMinutes: (weekSessions||[]).reduce((s,x)=> s+n0(x.minutes), 0),
      monthBooksFinished: (finished||[]).length
    };
  }

  async function renderLeituraView(){
    const el = document.getElementById('fr-leitura-content');
    el.innerHTML = `<div class="fr-loading">Carregando leitura...</div>`;
    await Promise.all([loadBooks(), loadReadingTargetsOnce()]);
    await loadReadingStats();
    renderLeituraContent();
  }

    const dailyGoal = Number(readingTargets.daily_minutes) || 0;

  function renderLeituraContent(){

    const finishedBooks = books.filter(b=> b.status === 'concluido');
    el.innerHTML = `
      ${readingGoalsHtml()}
      ${books.length===0
        ? `<div class="fr-empty-diary"><h3>Nenhum livro cadastrado ainda</h3><p>Toque em "Novo livro" para começar a acompanhar sua leitura.</p></div>`
        : `
          ${activeBooks.length ? `<div class="fr-section-label" style="max-width:1080px;margin:20px auto 12px;">Lendo agora</div>${activeBooks.map(bookRowHtml).join('')}` : ''}
          ${finishedBooks.length ? `<div class="fr-section-label" style="max-width:1080px;margin:20px auto 12px;">Concluídos</div>${finishedBooks.map(bookRowHtml).join('')}` : ''}
        `}
    `;
    const targetsBtn = document.getElementById('fr-reading-targets-btn');
    if(targetsBtn) targetsBtn.addEventListener('click', openReadingTargetsModal);
    el.querySelectorAll('.fr-book-actions button[data-act]').forEach(btn=>{
      btn.addEventListener('click', ()=>{
        const id = btn.getAttribute('data-id');

        const act = btn.getAttribute('data-act');

    const overlay = buildOverlay(`

      <form id="fr-book-form">
        <div class="fr-field"><label for="fr-book-title">Título</label><input type="text" id="fr-book-title" required value="${esc(b.title||'')}" placeholder="ex.: O Hobbit"></div>

        <div class="fr-row">

          <div class="fr-field"><label for="fr-book-current">Página em que parou</label><input type="number" min="0" id="fr-book-current" value="${esc(b.current_page ?? 0)}"></div>
        </div>
        <div class="fr-field"><label for="fr-book-status">Status</label>
          <select id="fr-book-status">
            <option value="lendo" ${b.status==='lendo'?'selected':''}>Lendo</option>
            <option value="pausado" ${b.status==='pausado'?'selected':''}>Pausado</option>
            <option value="concluido" ${b.status==='concluido'?'selected':''}>Concluído</option>
          </select>
        </div>
        <div class="fr-form-actions">
          ${isEdit ? '<button type="button" class="fr-btn-danger" id="fr-book-delete">Excluir</button>' : '<button type="button" class="fr-btn-ghost" id="fr-book-cancel">Cancelar</button>'}
          <button type="submit" class="fr-btn-primary">${isEdit ? 'Salvar alterações' : 'Salvar livro'}</button>
        </div>
      </form>
    `);
    const cancelBtn = overlay.querySelector('#fr-book-cancel');
    if(cancelBtn) cancelBtn.addEventListener('click', closeOverlay);
    const deleteBtn = overlay.querySelector('#fr-book-delete');
    if(deleteBtn) deleteBtn.addEventListener('click', ()=>{ closeOverlay(); confirmDeleteBook(existing); });
    overlay.querySelector('#fr-book-form').addEventListener('submit', async function(e){
      e.preventDefault();
      const submitBtn = overlay.querySelector('button[type="submit"]');
      const title = document.getElementById('fr-book-title').value.trim();
      if(!title){ document.getElementById('fr-book-title').focus(); return; }
      const status = document.getElementById('fr-book-status').value;
      const wasFinished = isEdit && existing.status === 'concluido';
      const payload = {
        title,
        author: document.getElementById('fr-book-author').value.trim() || null,
        total_pages: numOrNull(document.getElementById('fr-book-total').value),
        current_page: numOrNull(document.getElementById('fr-book-current').value) || 0,
        status
      };
      if(status==='concluido' && !wasFinished){ payload.finished_at = todayStr(); }
      if(status!=='concluido'){ payload.finished_at = null; }
      submitBtn.disabled = true; submitBtn.textContent = 'Salvando...';
      try{
        if(isEdit){
          const { error } = await sb.from('books').update(payload).eq('id', existing.id);
          if(error) throw error;
          books = books.map(x=> x.id===existing.id ? {...x, ...payload} : x);
        } else {
          payload.user_id = currentUser.id;
          payload.started_at = todayStr();
          const { data, error } = await sb.from('books').insert(payload).select().single();
          if(error) throw error;
          books.push(data);

        showToast('Livro salvo.', 'ok');
        closeOverlay();

        renderLeituraContent();
      }catch(err){
        console.error(err);
        showToast('Não foi possível salvar agora. Tente novamente.', 'err');
        submitBtn.disabled = false;
        submitBtn.textContent = isEdit ? 'Salvar alterações' : 'Salvar livro';
      }
    });
    setTimeout(()=> document.getElementById('fr-book-title').focus(), 30);

          <button type="submit" class="fr-btn-primary">Registrar</button>
        </div>
      </form>
    `);
    overlay.querySelector('#fr-rl-cancel').addEventListener('click', closeOverlay);
    overlay.querySelector('#fr-reading-log-form').addEventListener('submit', async function(e){
      e.preventDefault();
      const submitBtn = overlay.querySelector('button[type="submit"]');
      const minutes = numOrNull(document.getElementById('fr-rl-minutes').value);
      if(!minutes || minutes<=0){ document.getElementById('fr-rl-minutes').focus(); return; }
      const date = document.getElementById('fr-rl-date').value || todayStr();
      const newPage = numOrNull(document.getElementById('fr-rl-page').value);
      submitBtn.disabled = true; submitBtn.textContent = 'Salvando...';

        closeOverlay();
        await loadReadingStats();
        renderLeituraContent();
      }catch(err){
        console.error(err);
        showToast('Não foi possível salvar agora. Tente novamente.', 'err');

        submitBtn.textContent = 'Registrar';
      }
    });

  // Fatores de rendimento (peso cozido ÷ peso cru) pros alimentos mais comuns que
  // aparecem "já cozidos" nas receitas. Usado só pra converter de volta pra uma
  // estimativa de quanto comprar cru — sem isso, a lista de compras pediria pra
  // comprar a quantidade já cozida, que não é o que se encontra no mercado.
  const COOKED_YIELD_FACTORS = [
    [/arroz/i, 2.75], [/feij[aã]o/i, 2.3], [/lentilha/i, 2.2], [/gr[aã]o.?de.?bico/i, 2.2],
    [/macarr[aã]o/i, 2.1], [/quinoa/i, 2.8], [/canjica/i, 2.5],
    [/frango/i, 0.75], [/\bcarne\b/i, 0.7], [/porco|su[íi]n[oa]|lombo/i, 0.7],
    [/peixe|merluza|til[aá]pia|salm[ãa]o/i, 0.8], [/camar[ãa]o/i, 0.85]
  ];
  function estimateRawQuantity(itemName, qty){
    if(!/cozid[oa]s?/i.test(itemName)) return { qty, converted:false };
    const match = COOKED_YIELD_FACTORS.find(([re])=> re.test(itemName));
    if(!match) return { qty, converted:false };
    const [, factor] = match;
    return { qty: qty/factor, converted:true };
  }

  function generateShoppingList(list){
    const resultEl = document.getElementById('fr-shop-result');
    const chosen = list.filter(r=> shoppingQuantities[r.id] > 0);
    if(chosen.length===0){
      resultEl.innerHTML = `<p class="fr-hint">Escolha ao menos uma receita com quantidade maior que zero.</p>`;
      return;
    }
    const aggregated = new Map();
    const freeform = new Map();
    let anyMissingIngredients = false;
    let anyConverted = false;
    chosen.forEach(r=>{
      const desired = shoppingQuantities[r.id];
      const base = Number(r.portions) || 1;
      const multiplier = desired / base;
      const ings = r.ingredients_structured || [];
      if(ings.length===0) anyMissingIngredients = true;
      ings.forEach(ing=>{
        if(ing.quantity===null || ing.quantity===undefined || ing.quantity===''){
          const key = normalize(ing.item) + '|' + (ing.unit||'');
          freeform.set(key, { item: ing.item, unit: ing.unit });
          return;
        }
        let scaledQty = Number(ing.quantity) * multiplier;
        let converted = false;
        if((ing.unit||'').toLowerCase()==='g' || (ing.unit||'').toLowerCase()==='kg'){
          const est = estimateRawQuantity(ing.item, scaledQty);
          scaledQty = est.qty; converted = est.converted;
          if(converted) anyConverted = true;
        }
        const key = normalize(ing.item) + '|' + (ing.unit||'');
        if(aggregated.has(key)){ aggregated.get(key).quantity += scaledQty; if(converted) aggregated.get(key).converted = true; }
        else { aggregated.set(key, { item: ing.item, unit: ing.unit, quantity: scaledQty, converted }); }
      });
    });
    const items = Array.from(aggregated.values()).sort((a,b)=>a.item.localeCompare(b.item,'pt-BR'));
    const freeItems = Array.from(freeform.values()).sort((a,b)=>a.item.localeCompare(b.item,'pt-BR'));
    if(items.length===0 && freeItems.length===0){
      resultEl.innerHTML = `<p class="fr-hint">Nenhuma das receitas escolhidas tem ingredientes cadastrados ainda. Edite a receita e adicione os ingredientes pra gerar a lista.</p>`;
      return;
    }
    resultEl.innerHTML = `
      <h3 class="fr-form-title" style="font-size:17px;">Sua lista de compras</h3>
      ${anyMissingIngredients ? `<div class="fr-hint" style="color:var(--rust);margin-bottom:10px;">Alguma receita escolhida ainda não tem ingredientes cadastrados — edite-a pra completar a lista.</div>` : ''}
      ${anyConverted ? `<div class="fr-hint" style="margin-bottom:10px;">Itens com <b>*</b> foram convertidos pra quantidade crua estimada, já que a receita descreve eles já cozidos.</div>` : ''}
      <div class="fr-shop-list">
        ${items.map(i=>`<div class="fr-shop-item"><span>${esc(i.item)}${i.converted?' *':''}</span><b>${formatQty(i.quantity)} ${esc(i.unit||'')}</b></div>`).join('')}

      <div class="fr-workout-actions">

      html += `<p class="fr-hint" style="margin-bottom:20px;">Nenhum treino seu ainda. Monte um do zero, faça a avaliação, ou espere seu profissional te atribuir um.</p>`;

      html += `<div class="fr-grid" style="margin-bottom:24px;">${myWorkouts.map(workoutCardHtml).join('')}</div>`;
    }
    html += `<div class="fr-section-label">Biblioteca de exercícios (referência geral)</div>`;
    if(library.length===0){
      html += `<p class="fr-hint">Nenhum treino geral cadastrado ainda.</p>`;
    } else {
      html += `<div class="fr-grid">${library.map(workoutCardHtml).join('')}</div>`;

  async function checkOwnAssessmentStatus(){
    const el = document.getElementById('fr-assessment-status');
    if(!el) return;
    const { data } = await sb.from('assessment_submissions').select('*').eq('user_id', currentUser.id).order('created_at', {ascending:false}).limit(1).maybeSingle();
    if(!data || data.status==='approved'){ el.innerHTML=''; return; }
    if(data.status==='pending'){
      el.innerHTML = `<div class="fr-detail-notes" style="max-width:1080px;margin:0 auto 16px;">Sua avaliação foi enviada e está aguardando revisão. Assim que for liberada, seu treino aparece aqui em "Meus treinos".</div>`;
    } else if(data.status==='needs_professional'){
      el.innerHTML = `<div class="fr-detail-notes" style="max-width:1080px;margin:0 auto 16px;">Depois de revisar sua avaliação, recomendamos buscar um profissional (médico ou educador físico) antes de liberar um treino, por causa da limitação informada.</div>`;
    }
  }

  function workoutCardHtml(w){
    let tag = 'Geral', color = 'var(--blue)';
    if(w.assigned_to_user_id === currentUser.id && w.created_by !== currentUser.id){ tag = 'Seu personal'; color = 'var(--green-deep)'; }
    else if(w.created_by === currentUser.id){ tag = 'Você montou'; color = 'var(--mustard)'; }
    return `
      <div class="fr-card" id="fr-workout-card-${w.id}" tabindex="0" role="button" aria-label="Ver treino ${esc(w.name)}">
        <div class="fr-card-hole"></div>
        <div class="fr-card-tab" style="background:${color}">${esc(tag)}</div>
        <div class="fr-card-name">${esc(w.name)}</div>
        ${w.notes ? `<div class="fr-card-notes">${esc(w.notes)}</div>` : ''}
      </div>`;

  /* ---------- Biblioteca de exercícios (pra montar treino / avaliação) ---------- */
  let exerciseLibrary = [];
  let exerciseLibraryLoaded = false;

  async function loadExerciseLibrary(){
    if(exerciseLibraryLoaded) return;
    const { data: libWorkouts } = await sb.from('workouts').select('id, name').is('assigned_to_user_id', null);
    if(!libWorkouts || libWorkouts.length===0){ exerciseLibrary = []; exerciseLibraryLoaded = true; return; }
    const ids = libWorkouts.map(w=>w.id);
    const { data: exs } = await sb.from('workout_exercises').select('*').in('workout_id', ids).order('position');
    const nameById = {}; libWorkouts.forEach(w=> nameById[w.id]=w.name);
    exerciseLibrary = (exs||[]).map(e=> ({ ...e, group_name: nameById[e.workout_id] || 'Outros' }));
    exerciseLibraryLoaded = true;
  }

  function groupLibraryByMuscle(){
    const groups = {};
    exerciseLibrary.forEach(e=>{
      if(!groups[e.group_name]) groups[e.group_name] = [];
      groups[e.group_name].push(e);
    });
    return groups;
  }

  async function openExercisePickerModal(){
    const overlay = buildOverlay(`
      <h3 class="fr-form-title">Montar meu treino</h3>
      <div class="fr-field"><label for="fr-pick-name">Nome do treino</label><input type="text" id="fr-pick-name" placeholder="ex.: Treino de hoje" value="Meu treino"></div>
      <button type="button" class="fr-btn-ghost" id="fr-pick-only-cardio" style="width:100%;margin-bottom:12px;">🏃 Só cardio hoje (marca só as opções de cardio)</button>
      <div id="fr-pick-list"><div class="fr-loading">Carregando exercícios...</div></div>
      <button class="fr-btn-primary" id="fr-pick-save" style="width:100%;margin-top:16px;">Salvar meu treino</button>
    `);
    await loadExerciseLibrary();
    const listEl = overlay.querySelector('#fr-pick-list');
    const groups = groupLibraryByMuscle();
    if(Object.keys(groups).length===0){
      listEl.innerHTML = `<p class="fr-hint">Nenhum exercício disponível na biblioteca ainda.</p>`;
      return;
    }
    listEl.innerHTML = Object.keys(groups).map(gName=>`
      <div class="fr-pick-group">
        <div class="fr-pick-group-title">${esc(gName)}</div>
        ${groups[gName].map(e=>`
          <label class="fr-pick-row">
            <input type="checkbox" class="fr-pick-checkbox" value="${e.id}">
            <span>${esc(e.name)} <small>${e.sets||'?'}x${esc(e.reps||'?')}</small></span>
          </label>`).join('')}
      </div>`).join('');

    overlay.querySelector('#fr-pick-only-cardio').addEventListener('click', function(){
      overlay.querySelectorAll('.fr-pick-checkbox').forEach(cb=>{ cb.checked = false; });
      const cardioExs = groups['Treino de Cardio'] || [];
      const cardioIds = new Set(cardioExs.map(e=>e.id));
      overlay.querySelectorAll('.fr-pick-checkbox').forEach(cb=>{ if(cardioIds.has(cb.value)) cb.checked = true; });
      document.getElementById('fr-pick-name').value = 'Cardio';
      const cardioGroupEl = Array.from(overlay.querySelectorAll('.fr-pick-group-title')).find(el=> el.textContent==='Treino de Cardio');
      if(cardioGroupEl) cardioGroupEl.scrollIntoView({behavior:'smooth', block:'start'});
    });

    overlay.querySelector('#fr-pick-save').addEventListener('click', async function(){
      const checked = Array.from(overlay.querySelectorAll('.fr-pick-checkbox:checked')).map(c=>c.value);
      if(checked.length===0){ showToast('Selecione ao menos um exercício.', 'err'); return; }
      const name = document.getElementById('fr-pick-name').value.trim() || 'Meu treino';
      const btn = this;
      btn.disabled = true; btn.textContent = 'Salvando...';
      const selectedExercises = exerciseLibrary.filter(e=> checked.includes(e.id));
      const workoutId = await saveNewPersonalWorkout(name, selectedExercises);
      if(!workoutId){ btn.disabled=false; btn.textContent='Salvar meu treino'; return; }
      showToast('Treino montado! Ajuste os detalhes de cada exercício se quiser.', 'ok');
      closeOverlay();
      // Encaminha direto pra tela de editar os exercícios — é lá que dá pra
      // personalizar série por série (carga, tempo, descanso individual),
      // assim que o treino acaba de ser criado, sem precisar voltar depois
      // pela lista de treinos e entrar em "editar".
      openWorkoutExerciseManager(workoutId, name);
    });
  }

  // Retorna o id do treino criado (usado pra já encaminhar pra tela de
  // editar os exercícios logo depois de criar), ou null se der erro.
  async function saveNewPersonalWorkout(name, exercisesToCopy){
    try{
      const { data: w, error: wErr } = await sb.from('workouts').insert({
        name, assigned_to_user_id: currentUser.id, created_by: currentUser.id, notes: null
      }).select().single();
      if(wErr) throw wErr;
      const rows = exercisesToCopy.map((e,i)=> ({
        workout_id: w.id, position: i+1, name: e.name, sets: e.sets, reps: e.reps,
        rest_seconds: e.rest_seconds, video_url: e.video_url, notes: e.notes,
        sets_detail: e.sets_detail || null
      }));
      const { error: exErr } = await sb.from('workout_exercises').insert(rows);
      if(exErr) throw exErr;
      return w.id;
    }catch(err){
      console.error(err);
      showToast('Não foi possível salvar o treino agora.', 'err');
      return null;
    }
  }

  /* ---------- Importar treino de arquivo (PDF / XLSX / CSV) ---------- */
  // Cada item é { tmpId, name, exercises: [{...campos, _tmpId}] } — um
  // arquivo pode trazer vários treinos juntos (ex.: "Legs",
  // "Superiores", "Abs" separados no PDF do personal), e cada um vira
  // seu próprio cartão editável na revisão, salvo como um treino
  // separado.
  let importedWorkoutsDraft = [];

  function openImportWorkoutModal(){
    importedWorkoutsDraft = [];
    const overlay = buildOverlay(`
      <h3 class="fr-form-title">Importar treino de arquivo</h3>
      <p class="fr-hint" style="margin-bottom:14px;">Envie um PDF ou uma planilha (Excel/CSV) com o treino que seu personal te passou. O Saber tenta identificar os exercícios automaticamente — se o arquivo tiver mais de um treino (tipo "Superiores", "Inferiores", "Abs"), cada um vira um treino separado. Você confere e ajusta antes de salvar.</p>
      <div class="fr-field"><label for="fr-import-file-input">Arquivo (PDF, XLSX, XLS ou CSV — até 4MB)</label><input type="file" id="fr-import-file-input" accept=".pdf,.xlsx,.xls,.csv"></div>
      <button class="fr-btn-primary" id="fr-import-analyze" style="width:100%;margin-top:10px;">Analisar arquivo</button>
      <div id="fr-import-result"></div>
    `);
    overlay.querySelector('#fr-import-analyze').addEventListener('click', analyzeImportFile);
  }

  function fileToBase64(file){
    return new Promise((resolve, reject)=>{
      const reader = new FileReader();
      reader.onload = ()=>{
        const result = String(reader.result || '');
        resolve(result.split(',')[1] || '');
      };
      reader.onerror = reject;
      reader.readAsDataURL(file);
    });
  }

  async function analyzeImportFile(){
    const btn = document.getElementById('fr-import-analyze');
    const fileInput = document.getElementById('fr-import-file-input');
    const resultEl = document.getElementById('fr-import-result');
    const file = fileInput.files && fileInput.files[0];
    if(!file){ showToast('Escolha um arquivo primeiro.', 'err'); return; }
    const MAX_BYTES = 4 * 1024 * 1024;
    if(file.size > MAX_BYTES){ showToast('Arquivo muito grande (máximo 4MB).', 'err'); return; }
    btn.disabled = true; btn.textContent = 'Analisando...';
    resultEl.innerHTML = `<div class="fr-loading" style="margin-top:10px;">Lendo o arquivo...</div>`;
    try{
      const base64 = await fileToBase64(file);
      const { data: sessionData } = await sb.auth.getSession();
      const token = sessionData?.session?.access_token;
      const res = await fetch(`${SUPABASE_URL}/functions/v1/import-workout-file`, {
        method: 'POST',
        headers: { 'Authorization': `Bearer ${token}`, 'Content-Type': 'application/json' },
        body: JSON.stringify({ filename: file.name, content_base64: base64 })
      });
      const result = await res.json();
      if(!res.ok || result.error){
        console.error('Não foi possível importar o arquivo:', result);
        resultEl.innerHTML = `<p class="fr-hint" style="color:var(--rust);margin-top:8px;">Não consegui ler esse arquivo. Tente outro formato, ou monte o treino manualmente em "Montar meu treino".</p>`;
        btn.disabled = false; btn.textContent = 'Analisar arquivo';
        return;
      }
      // Compatibilidade: se por algum motivo vier o formato antigo
      // (lista simples de exercícios, sem divisão em treinos), trata
      // como um treino só.
      const rawWorkouts = result.workouts || (result.exercises ? [{ name: 'Treino importado', exercises: result.exercises }] : []);
      importedWorkoutsDraft = rawWorkouts.map((w,wi)=> ({
        tmpId: 'wk'+wi+'_'+Date.now(),
        name: w.name || 'Treino importado',
        exercises: (w.exercises||[]).map((e,i)=> ({ ...e, _tmpId: 'imp'+wi+'_'+i+'_'+Date.now() }))
      }));
      renderImportReview(resultEl, result.warnings || []);
      btn.style.display = 'none';
    }catch(err){
      console.error(err);
      resultEl.innerHTML = `<p class="fr-hint" style="color:var(--rust);margin-top:8px;">Não consegui analisar o arquivo agora. Tente novamente.</p>`;
      btn.disabled = false; btn.textContent = 'Analisar arquivo';
    }
  }

  function renderImportReview(container, warnings){
    const warnHtml = warnings.length ? `<div class="fr-hint" style="margin:10px 0;color:var(--ink-soft);">${warnings.map(w=>esc(w)).join('<br>')}</div>` : '';
    container.innerHTML = `
      ${warnHtml}
      <div class="fr-section-label" style="padding-top:0;">Treinos encontrados — confira nome, exercícios e ajuste antes de salvar</div>
      <div id="fr-import-workout-list"></div>
      <button type="button" class="fr-btn-ghost" id="fr-import-add-workout" style="width:100%;margin-top:8px;">${PLUS_SVG} Adicionar treino</button>
      <button class="fr-btn-primary" id="fr-import-save" style="width:100%;margin-top:14px;">Salvar treino(s)</button>
    `;
    renderImportWorkoutGroups();
    container.querySelector('#fr-import-add-workout').addEventListener('click', ()=>{
      importedWorkoutsDraft.push({ tmpId:'wk_new_'+Date.now(), name:'Treino importado', exercises: [] });
      renderImportWorkoutGroups();
    });
    container.querySelector('#fr-import-save').addEventListener('click', saveImportedWorkouts);
  }

  function renderImportWorkoutGroups(){
    const listEl = document.getElementById('fr-import-workout-list');
    if(!listEl) return;
    if(importedWorkoutsDraft.length===0){
      listEl.innerHTML = `<p class="fr-hint">Nenhum treino ainda — adicione manualmente abaixo.</p>`;
      return;
    }
    listEl.innerHTML = importedWorkoutsDraft.map(w=>`
      <div class="fr-import-workout" data-wk="${w.tmpId}" style="border:1px solid var(--border);border-radius:10px;padding:12px;margin-bottom:14px;">
        <div class="fr-field"><label>Nome do treino</label><input type="text" class="fr-imp-wk-name" value="${escAttr(w.name||'')}" placeholder="ex.: Superiores"></div>
        <div class="fr-imp-rows" data-wk="${w.tmpId}"></div>
        <button type="button" class="fr-btn-ghost fr-imp-add-ex" style="width:100%;margin-top:6px;">${PLUS_SVG} Adicionar exercício</button>
        <button type="button" class="fr-btn-ghost fr-imp-remove-wk" style="width:100%;margin-top:6px;color:var(--rust);">Remover este treino</button>
      </div>
    `).join('');
    importedWorkoutsDraft.forEach(w=> renderImportRows(w.tmpId));
    listEl.querySelectorAll('.fr-import-workout').forEach(card=>{
      const wkId = card.getAttribute('data-wk');
      card.querySelector('.fr-imp-wk-name').addEventListener('input', (e)=>{
        const w = importedWorkoutsDraft.find(x=> x.tmpId===wkId);
        if(w) w.name = e.target.value;
      });
      card.querySelector('.fr-imp-add-ex').addEventListener('click', ()=>{
        const w = importedWorkoutsDraft.find(x=> x.tmpId===wkId);
        if(!w) return;
        w.exercises.push({ name:'', sets:'', reps:'', rest_seconds:null, notes:'', _tmpId:'imp_new_'+Date.now() });
        renderImportRows(wkId);
      });
      card.querySelector('.fr-imp-remove-wk').addEventListener('click', ()=>{
        importedWorkoutsDraft = importedWorkoutsDraft.filter(x=> x.tmpId!==wkId);
        renderImportWorkoutGroups();
      });
    });
  }

  function renderImportRows(wkId){
    const listEl = document.querySelector(`.fr-imp-rows[data-wk="${wkId}"]`);
    if(!listEl) return;
    const w = importedWorkoutsDraft.find(x=> x.tmpId===wkId);
    if(!w) return;
    if(w.exercises.length===0){
      listEl.innerHTML = `<p class="fr-hint">Nenhum exercício ainda neste treino — adicione manualmente abaixo.</p>`;
      return;
    }
    listEl.innerHTML = w.exercises.map(e=>`
      <div class="fr-import-row" data-tmp="${e._tmpId}" style="border:1px solid var(--border);border-radius:8px;padding:10px;margin-bottom:8px;">
        <div class="fr-field"><label>Exercício</label><input type="text" class="fr-imp-name" value="${escAttr(e.name||'')}" placeholder="Nome do exercício"></div>
        <div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;">
          <div class="fr-field"><label>Séries</label><input type="text" class="fr-imp-sets" value="${escAttr(e.sets==null?'':e.sets)}"></div>
          <div class="fr-field"><label>Repetições</label><input type="text" class="fr-imp-reps" value="${escAttr(e.reps==null?'':e.reps)}"></div>
          <div class="fr-field"><label>Descanso (s)</label><input type="number" min="0" class="fr-imp-rest" value="${e.rest_seconds==null?'':e.rest_seconds}"></div>
        </div>
        <div class="fr-field"><label>Observações</label><textarea class="fr-imp-notes" rows="2" style="width:100%;resize:vertical;">${esc(e.notes||'')}</textarea></div>
        <button type="button" class="fr-btn-ghost fr-imp-remove" style="width:100%;">Remover</button>
      </div>
    `).join('');
    listEl.querySelectorAll('.fr-import-row').forEach(row=>{
      const tmpId = row.getAttribute('data-tmp');
      row.querySelector('.fr-imp-remove').addEventListener('click', ()=>{
        w.exercises = w.exercises.filter(e=> e._tmpId !== tmpId);
        renderImportRows(wkId);
      });
    });
  }

  async function saveImportedWorkouts(){
    const btn = document.getElementById('fr-import-save');
    // Lê os valores atuais direto dos inputs de cada cartão de treino
    // (nome do treino + exercícios), na ordem em que aparecem na tela.
    const toSave = [];
    document.querySelectorAll('.fr-import-workout').forEach(card=>{
      const wkId = card.getAttribute('data-wk');
      const draftW = importedWorkoutsDraft.find(x=> x.tmpId===wkId);
      const name = card.querySelector('.fr-imp-wk-name').value.trim() || 'Treino importado';
      const rows = Array.from(card.querySelectorAll('.fr-import-row'));
      const exercises = rows.map(row=>{
        const tmpId = row.getAttribute('data-tmp');
        // sets_detail (o detalhe série a série vindo do PDF/planilha) não
        // tem campo editável na revisão — vem direto do que foi analisado,
        // casando pelo _tmpId de cada linha.
        const draftEx = draftW ? draftW.exercises.find(e=> e._tmpId===tmpId) : null;
        return {
          name: row.querySelector('.fr-imp-name').value.trim(),
          sets: row.querySelector('.fr-imp-sets').value.trim() || null,
          reps: row.querySelector('.fr-imp-reps').value.trim() || null,
          rest_seconds: row.querySelector('.fr-imp-rest').value ? parseInt(row.querySelector('.fr-imp-rest').value, 10) : null,
          notes: row.querySelector('.fr-imp-notes').value.trim() || null,
          video_url: null,
          sets_detail: (draftEx && Array.isArray(draftEx.sets_detail) && draftEx.sets_detail.length) ? draftEx.sets_detail : null
        };
      }).filter(e=> e.name);
      if(exercises.length>0) toSave.push({ name, exercises });
    });
    if(toSave.length===0){ showToast('Adicione ao menos um exercício com nome.', 'err'); return; }
    btn.disabled = true; btn.textContent = 'Salvando...';
    let okCount = 0;
    for(const w of toSave){
      const ok = await saveNewPersonalWorkout(w.name, w.exercises);
      if(ok) okCount++;
    }
    btn.disabled = false; btn.textContent = 'Salvar treino(s)';
    if(okCount===0){ return; } // saveNewPersonalWorkout já mostra o erro
    showToast(okCount===1 ? 'Treino importado e salvo!' : `${okCount} treinos importados e salvos!`, 'ok');
    importedWorkoutsDraft = [];
    closeOverlay();
    loadWorkouts();
  }

      closeOverlay();
